// 原稿の欄の、その行に移動して選ぶ
function jumpToLine(idx, line){
  var ta = card.querySelector('[data-id="m' + idx + '"]');
  if (!ta) return;
  var rows = ta.value.split("\n");
  var start = rows.slice(0, line - 1).join("\n").length + (line > 1 ? 1 : 0);
  var end = start + (rows[line - 1] || "").length;
  // その行が欄のまん中に来るように、同じ幅の見えない欄で高さを測る
  var probe = ta.cloneNode();
  probe.style.cssText = "position:absolute;visibility:hidden;height:0;width:" + ta.clientWidth + "px";
  probe.value = ta.value.slice(0, start);
  document.body.appendChild(probe);
  var y = probe.scrollHeight;
  document.body.removeChild(probe);
  ta.scrollIntoView({ block: "center", behavior: "smooth" });
  ta.focus();
  ta.setSelectionRange(start, end);
  ta.scrollTop = Math.max(0, y - ta.clientHeight / 2);
}
function renderPaste(){
  var html = '<div class="step-title">原稿を貼る</div>' +
    '<div class="step-lead">AIが書いた原稿をコピーして、章ごとの欄に貼りつけてください。<br>4つ全部そろっていなくても、貼った章から仕上げられます。</div>' +
    '<div class="step-note">AIの返事の下にある「コピー」のマークを押すと、原稿をまるごとコピーできます。原稿が途中で止まって「続き」を書いてもらったときは、続きも同じ欄に貼りたしてください。<br>記号のまちがいがあったら、「AIに直してもらう文をコピー」を押して、同じAIのチャットに貼って送ると、直した原稿を出してくれます。</div>' +
    '<div class="summary-box" id="pasteSummary">' + pasteSummaryHtml() + "</div>";
  CH_NAMES.forEach(function(nm, i){
    html += '<div class="paste-box"><h3>' + nm + 'の原稿</h3>' +
      '<textarea class="paste-text" data-id="m' + i + '" placeholder="ここに' + nm + 'の原稿を貼りつけます">' + esc(answers["m" + i] || "") + "</textarea>" +
      '<div class="status" id="st' + i + '">' + pasteStatusHtml(i) + "</div></div>";
  });
  card.innerHTML = html;
}

// =====================================================
// 「仕上げてPDFにする」の画面
// =====================================================
function renderFinish(){
  var idx = curChap();
  var html = '<div class="step-title">仕上げてPDFにする</div>' +
    '<div class="step-lead">色とアイコンを選ぶと、下の特典にすぐ反映されます。LINEでは章ごとに配るので、1章ずつPDFにします。</div>' +
    '<div class="design-grid">' +
      '<label>ブランドカラー<input type="color" data-id="dColor" value="' + esc(designColor()) + '"></label>' +
      '<label>アイコン画像<span class="icon-row"><input type="file" id="inIcon" accept="image/*">' +
        (answers.dIcon ? '<button class="small-btn" id="btnIconOff">外す</button>' : "") + "</span></label>" +
      '<label>屋号｜肩書き<input type="text" data-id="dYago" value="' + esc(designYago()) + '"></label>' +
      '<label>キャッチコピー<input type="text" data-id="dCatch" value="' + esc(designCatch()) + '" placeholder="例）片づけが続く家は「しくみ」でできている"></label>' +
      '<label>表紙の文字色<select data-id="dCoverText" class="design-select">' +
        [["auto", "自動（おすすめ）"], ["white", "白"], ["dark", "濃い色"]].map(function(o){
          return '<option value="' + o[0] + '"' + (coverTextMode() === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
        }).join("") + "</select></label>" +
      '<label>表紙で目立たせる言葉（空欄なら自動）<input type="text" data-id="dStrong" value="' + esc(answers.dStrong || "") + '"></label>' +
    "</div>" +
    '<div class="chap-tabs">' + CH_NAMES.map(function(nm, i){
      var c = checkChapter(i);
      return '<button data-chap="' + i + '" class="' + (i === idx ? "on" : "") + (c.empty ? " empty" : "") + '"' +
        (c.warns.length ? ' title="記号の確認が ' + c.warns.length + 'か所あります"' : "") + ">" + nm + (c.warns.length ? " ⚠" : "") + "</button>";
    }).join("") + '<button class="small-btn" data-recheck="1" style="margin-left:auto">もう一度チェックする</button></div>' +
    '<div id="finishAlerts"></div>' +
    '<button class="print-big" id="btnPrintChap">' + CH_NAMES[idx] + "をPDFにする</button>" +
    '<div class="print-hint">印刷の画面で「送信先：PDFに保存」を選び、「詳細設定」の「背景のグラフィック」にチェックを入れて保存してください。</div>';
  card.innerHTML = html;
  preview.classList.add("show");
  layoutChapter();
}

function updateFinishAlerts(){
  var box = document.getElementById("finishAlerts");
  if (!box) return;
  var info = layoutInfo, h = "";
  if (info.empty) { box.innerHTML = '<div class="alert yk">この章の原稿がまだ貼られていません。 <button class="link-btn" data-go="6">原稿を貼る画面へ</button></div>'; return; }
  var idx = curChap();
  if (info.warns.length) {
    h += '<div class="alert ng"><b>⚠ ' + info.warns.length + "か所、記号を確認してください</b>" + warnListHtml(idx, info.warns) +
      '<div style="margin-top:4px">コピーした文を、原稿を書いてもらったAIのチャットに貼って送ると、直した原稿を出してくれます。それを <button class="link-btn" data-go="6">原稿を貼る画面</button> で貼りかえてください。</div></div>';
  }
  if (info.yk) {
    // 特典の中の黄色い所を、ページ番号と文章で一覧にする（押すとその場所へ移動）
    var lines = ykLines(answers["m" + idx] || "");
    var marks = Array.prototype.slice.call(preview.querySelectorAll(".d-yk")).filter(function(el){ return !el.closest(".d-cover"); });
    var occ = [];
    lines.forEach(function(y){ var n = (y.text.match(/（要確認|\(要確認/g) || []).length; for (var k = 0; k < n; k++) occ.push(y); });
    var pages = Array.prototype.slice.call(preview.querySelectorAll(".d-page"));
    h += '<div class="alert yk"><b>（要確認）が ' + info.yk + " か所あります。</b>黄色の所です。PDFにする前に、ご自身の言葉に書きかえるのがおすすめです。（押すと、その場所に移動します）" +
      '<ul class="yk-list">' +
      Array.prototype.slice.call(preview.querySelectorAll(".d-yk")).slice(0, 10).map(function(el, k){
        var page = pages.indexOf(el.closest(".d-page")) + 1;
        var mi = marks.indexOf(el);
        var src = mi >= 0 && occ.length === marks.length ? occ[mi] : null;
        var ctx = trimAll((el.closest("p,li,dd,div") || el).textContent);
        if (ctx.length > 50) ctx = ctx.slice(0, 50) + "…";
        return '<li><button class="link-btn" data-ykgo="' + k + '">' + page + "ページ目" + (src ? "（原稿の" + src.line + "行目）" : "") + "</button>：" + esc(ctx) + "</li>";
      }).join("") + "</ul></div>";
  }
  // 表紙で目立たせる言葉：空欄なら、今自動で選ばれている言葉をうすく見せる／タイトルにない言葉なら知らせる
  var strongInput = card.querySelector('[data-id="dStrong"]');
  if (strongInput) {
    var auto = strongWord(lastMainTitle);
    strongInput.placeholder = auto ? "空欄なら自動：「" + auto + "」" : "空欄なら自動";
  }
  if (v("dStrong") && lastMainTitle.indexOf(v("dStrong")) < 0) {
    h += '<div class="alert yk"><b>表紙で目立たせる言葉「' + esc(v("dStrong")) + "」は、タイトルの中に見つかりません。</b>全体タイトルの中にある言葉を、そのまま入れてください（今は色を付けていません）。</div>";
  }
  if (hiddenPrice.length) {
    h += '<div class="alert yk"><b>原稿に「料金」の行が ' + hiddenPrice.length + " か所残っています。</b>料金は" + esc(cname()) + "の中でお伝えするので、案内カードには表示していません。" +
      ' <button class="mini-btn" data-delprice="1">原稿から料金の行を消す</button></div>';
  }
  if (coverTextMode() === "white" && whiteIsHard(designColor())) {
    h += '<div class="alert yk"><b>この色だと、表紙の文字が読みにくいかもしれません。</b>「表紙の文字色」は「自動（おすすめ）」か「濃い色」がおすすめです。（このお知らせは印刷されません）</div>';
  }
  if (info.tall) h +='<div class="alert ng"><b>1ページに入りきらない部品が ' + info.tall + " か所あります。</b>その部分の文章を短くすると、きれいに収まります。</div>";
  if (!h) h = '<div class="alert ok">✓ 記号も（要確認）も問題ありません。このままPDFにできます。</div>';
  box.innerHTML = h;
}

card.addEventListener("click", function(e){
  var t = e.target.closest("[data-chap],[data-go],[data-fix],[data-jump],[data-recheck],[data-ykgo],[data-delprice],#btnPrintChap,#btnIconOff");
  if (!t) return;
  if (t.hasAttribute("data-delprice")) { deleteHiddenPrice(); return; }
  if (t.hasAttribute("data-fix")) {
    var fp = t.getAttribute("data-fix").split(":"), fi = Number(fp[0]);
    var ws = checkChapter(fi).warns;
    copyText(fixRequest(fi, fp[1] === "all" ? ws : [ws[Number(fp[1])]].filter(Boolean)), t);
    return;
  }
  if (t.hasAttribute("data-jump")) { var jp = t.getAttribute("data-jump").split(":"); jumpToLine(Number(jp[0]), Number(jp[1])); return; }
  if (t.hasAttribute("data-recheck")) { recheckAll(); return; }
  if (t.hasAttribute("data-ykgo")) {
    var mark = preview.querySelectorAll(".d-yk")[Number(t.getAttribute("data-ykgo"))];
    if (mark) {
      mark.scrollIntoView({ block: "center", behavior: "smooth" });
      mark.classList.add("d-flash");
      setTimeout(function(){ mark.classList.remove("d-flash"); }, 2500);
    }
    return;
  }
  if (t.hasAttribute("data-chap")) { answers.curChap = Number(t.getAttribute("data-chap")); save(); renderFinish(); return; }
  if (t.hasAttribute("data-go")) { go(Number(t.getAttribute("data-go"))); return; }
  if (t.id === "btnIconOff") { delete answers.dIcon; save(); renderFinish(); return; }
  if (t.id === "btnPrintChap") printChapter();
});

card.addEventListener("change", function(e){
  if (e.target.id !== "inIcon") return;
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    // 保存できる大きさに小さくする（正方形・320ピクセル）
    var img = new Image();
    img.onload = function(){
      var size = 320, cv = document.createElement("canvas");
      cv.width = size; cv.height = size;
      var s = Math.min(img.width, img.height);
      cv.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      answers.dIcon = cv.toDataURL("image/png");
      save();
      renderFinish();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

// =====================================================
// 完成形の画面で、文字を直接直す
// 直した文字は、原稿の「同じ行の、文字の部分だけ」に書きもどして自動保存する
// =====================================================

// 画面の文字 → 原稿の文字（マーカーは記号の形にもどす）
function serializeEd(node){
  var out = "";
  node.childNodes.forEach(function(c){
    if (c.nodeType === 3) out += c.nodeValue;
    else if (c.nodeType === 1) {
      if (c.tagName === "BR" || c.tagName === "WBR") return;
      if (c.classList.contains("d-marker")) out += "【マーカー】" + serializeEd(c) + "【/マーカー】";
      else out += serializeEd(c);
    }
  });
  return out.replace(/ /g, " ").replace(/[\r\n]+/g, " ");
}

// 原稿の1行のうち、直した部分だけを入れかえた行を作る（記号はそのまま残す）
function rebuildLine(raw, mode, k, text){
  var m;
  if (mode === "tag") { m = raw.match(/^\s*【[^】]+】/); return (m ? m[0] : "") + text; }
  if (mode === "item") { m = raw.match(/^\s*(\d{1,2}[\.．、\)）]|[・•])\s*/); return (m ? m[0] : "") + text; }
  var i = raw.search(/[：:]/);
  if (mode === "after") return i < 0 ? text : raw.slice(0, i + 1) + text;
  if (mode === "key") return i < 0 ? text : text + raw.slice(i);
  if (mode === "pipe" || mode === "slash") {
    var head = i < 0 ? "" : raw.slice(0, i + 1), rest = i < 0 ? raw : raw.slice(i + 1);
    var parts = mode === "pipe" ? rest.split(/[｜|]/) : rest.split("／");
    parts[k] = text;
    return head + parts.join(mode === "pipe" ? "｜" : "／");
  }
  return text; // whole：行まるごと
}

function edKey(el){ return el.getAttribute("data-f") || ("m" + curChap()); }

// 1文字打つたびに、原稿（または欄）へ書きもどして保存する
function applyEdit(el){
  var text = serializeEd(el);
  var f = el.getAttribute("data-f");
  if (f) { answers[f] = text; save(); return; }
  var key = "m" + curChap(), rows = (answers[key] || "").split("\n");
  var n = Number(el.getAttribute("data-ln"));
  if (!(n >= 0 && n < rows.length)) return;
  var raw = rows[n], cr = /\r$/.test(raw) ? "\r" : "";
  rows[n] = rebuildLine(raw.replace(/\r$/, ""), el.getAttribute("data-m"), Number(el.getAttribute("data-k")), text) + cr;
  answers[key] = rows.join("\n");
  save();
}

// 文字を全部消したら、その行ごと原稿から消す（直し終わったときにまとめて消す）
var pendingDel = {};
function markEmpty(el){
  if (el.hasAttribute("data-f")) return;
  var mode = el.getAttribute("data-m"), n = Number(el.getAttribute("data-ln"));
  if (mode === "key") return;
  var rows = (answers["m" + curChap()] || "").split("\n"), raw = (rows[n] || "").replace(/\r$/, "");
  if (mode === "slash") {
    // 箇条の1つを消した → その項目だけ取りのぞく
    var i = raw.search(/[：:]/), head = i < 0 ? "" : raw.slice(0, i + 1);
    var parts = (i < 0 ? raw : raw.slice(i + 1)).split("／").filter(function(p){ return trimAll(p); });
    if (parts.length) { rows[n] = head + parts.join("／"); answers["m" + curChap()] = rows.join("\n"); return; }
  }
  if (mode === "pipe") {
    var j = raw.search(/[：:]/), segs = (j < 0 ? raw : raw.slice(j + 1)).split(/[｜|]/);
    if (segs.some(function(p){ return trimAll(p); })) return;
  }
  pendingDel[n] = true;
}

var editBefore = null;  // 直しはじめたときの中身（元に戻す用）
function commitEdits(){
  var key = "m" + curChap();
  var dels = Object.keys(pendingDel).map(Number).sort(function(a, b){ return b - a; });
  if (dels.length) {
    var rows = (answers[key] || "").split("\n");
    dels.forEach(function(n){
      rows.splice(n, 1);
      // 消したあとに空いた行が2つ続いたら、1つにする
      if (n > 0 && n < rows.length && !trimAll(rows[n - 1]) && !trimAll(rows[n])) rows.splice(n, 1);
    });
    answers[key] = rows.join("\n");
  }
  pendingDel = {};
  save();
  refreshFinishKeepScroll();
}
function refreshFinishKeepScroll(){
  var y = window.scrollY;
  renderFinish();
  window.scrollTo(0, y);
}
function pushUndo(key, value){
  undoStack.push({ key: key, value: value });
  if (undoStack.length > 50) undoStack.shift();
}

preview.addEventListener("focusin", function(e){
  var el = e.target.closest && e.target.closest(".ed");
  if (el) editBefore = { key: edKey(el), value: answers[edKey(el)] };
});
preview.addEventListener("input", function(e){
  var el = e.target.closest && e.target.closest(".ed");
  if (el) applyEdit(el);
});
preview.addEventListener("focusout", function(e){
  var el = e.target.closest && e.target.closest(".ed");
  if (!el) return;
  if (!trimAll(serializeEd(el))) markEmpty(el);
  var changed = editBefore && (answers[editBefore.key] !== editBefore.value || Object.keys(pendingDel).length);
  if (changed) pushUndo(editBefore.key, editBefore.value);
  editBefore = null;
  // ほかの文字に続けて移ったときは、まだ作り直さない（その文字が消えてしまうので）
  setTimeout(function(){
    var a = document.activeElement;
    if (a && a.classList && a.classList.contains("ed") && preview.contains(a)) return;
    if (changed) commitEdits();
  }, 0);
});
preview.addEventListener("keydown", function(e){
  var el = e.target.closest && e.target.closest(".ed");
  if (!el) return;
  // 改行は入れない（行がずれると、原稿の同じ場所に戻せなくなるため）。Enterで直し終わり
  if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); el.blur(); }
});
preview.addEventListener("paste", function(e){
  var el = e.target.closest && e.target.closest(".ed");
  if (!el) return;
  e.preventDefault();
  var t = (e.clipboardData || window.clipboardData).getData("text/plain").replace(/[\r\n]+/g, " ");
  document.execCommand("insertText", false, t);
});
preview.addEventListener("click", function(e){
  if (!e.target.closest("#btnUndo")) return;
  var u = undoStack.pop();
  if (!u) return;
  answers[u.key] = u.value;
  pendingDel = {};
  save();
  refreshFinishKeepScroll();
});

// 案内カードに出していない「料金」の行を、原稿から消す
function deleteHiddenPrice(){
  if (!hiddenPrice.length) return;
  var key = "m" + curChap();
  pushUndo(key, answers[key]);
  var rows = (answers[key] || "").split("\n");
  hiddenPrice.slice().sort(function(a, b){ return b - a; }).forEach(function(n){ rows.splice(n, 1); });
  answers[key] = rows.join("\n");
  save();
  refreshFinishKeepScroll();
}

function printChapter(){
  var idx = curChap();
  if (layoutInfo.empty) { alert(CH_NAMES[idx] + "の原稿がまだ貼られていません。"); return; }
  var msg = [];
  if (layoutInfo.yk) msg.push("（要確認）が " + layoutInfo.yk + " か所あります。");
  if (layoutInfo.warns.length) msg.push("記号の確認が " + layoutInfo.warns.length + " か所あります。");
  if (msg.length && !confirm(msg.join("\n") + "\nこのままPDFにしますか？")) return;
  var oldTitle = document.title;
  document.title = (v("yago") || "LINE特典") + "_" + CH_NAMES[idx];
  window.print();
  setTimeout(function(){ document.title = oldTitle; }, 1000);
}

render();
</script>
