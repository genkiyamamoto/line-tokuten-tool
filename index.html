<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINE特典メーカー</title>
<style>
:root{
  --brand:#2f8f83;
  --brand-dark:#21645c;
  --brand-pale:#eaf4f3;
  --text:#333333;
  --sub:#777777;
  --line:#d5d5d5;
  --bg:#f3f5f5;
  --font:"BIZ UDPGothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.8;font-size:16px}

/* ===== 上の帯 ===== */
.header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}
.header-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.app-title{font-size:20px;font-weight:bold;color:var(--brand-dark)}
.reset-btn{background:#fff;border:1px solid #bbb;color:#666;border-radius:999px;padding:6px 16px;font-size:14px;cursor:pointer;font-family:var(--font)}
.reset-btn:hover{background:#f5f5f5}

/* ===== 使い方・作った人 ===== */
.intro{padding:14px 16px 0}
.intro-inner{max-width:760px;margin:0 auto;background:#fff;border:1.5px solid var(--brand);border-radius:12px;padding:12px 18px}
.intro-title{font-weight:bold;color:var(--brand-dark);font-size:15px;margin-bottom:2px}
.intro-steps{list-style:none;font-size:14px;line-height:1.8}
.intro-steps b{color:var(--brand-dark);margin-right:4px}
.intro-notes{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:13px;color:#555}
.credit{text-align:center;font-size:12px;color:#999;padding:24px 16px 28px}

/* ===== 進み具合 ===== */
.progress{max-width:760px;margin:20px auto 0;padding:0 16px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.progress-count{font-size:22px;font-weight:bold;color:var(--brand-dark)}
.progress-name{font-size:15px;color:var(--sub)}
.progress-bar{height:10px;background:#dde3e3;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.progress-dots{display:flex;justify-content:space-between;margin-top:8px}
.progress-dots button{border:none;background:none;font-family:var(--font);font-size:12px;color:var(--sub);cursor:pointer;padding:2px 4px;border-radius:6px}
.progress-dots button.now{color:var(--brand-dark);font-weight:bold;background:var(--brand-pale)}

/* ===== 質問のカード ===== */
.main{max-width:760px;margin:20px auto 0;padding:0 16px 40px}
.card{background:#fff;border-radius:14px;padding:28px 24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.step-title{font-size:24px;font-weight:bold;margin-bottom:6px}
.step-lead{color:#555;margin-bottom:6px}
.step-note{font-size:14px;color:var(--brand-dark);background:var(--brand-pale);border-radius:8px;padding:8px 12px;margin:10px 0 4px}
.demo-box{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:14px 0 4px;padding:12px 14px;border:1.5px dashed #e9a23b;border-radius:10px;background:#fffaf0}
.demo-btn{font-family:var(--font);font-size:15px;font-weight:bold;background:#e98b2a;color:#fff;border:none;border-radius:999px;padding:9px 20px;cursor:pointer;white-space:nowrap}
.demo-btn:hover{background:#d4761a}
.demo-text{font-size:13px;color:#6b4a00;flex:1;min-width:200px}
.demo-done{color:#2f7d32}
.q{margin-top:26px}
.q-label{display:block;font-weight:bold;font-size:17px;margin-bottom:8px}
.q-label .num{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;font-size:13px;padding:0 10px;margin-right:8px;vertical-align:2px}
.q-hint{font-size:13px;color:var(--sub);margin:-4px 0 8px}
.q input,.q textarea,.q select{width:100%;font-family:var(--font);font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;line-height:1.7;color:var(--text)}
.q input:focus,.q textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-pale)}
.q input::placeholder,.q textarea::placeholder{color:#b5b5b5}
.q input[type=number]{width:120px}
.q .unit{margin-left:8px}
.checks{display:grid;gap:8px;margin-bottom:6px}
.check-row{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff}
.check-row:has(input:checked){border-color:var(--brand);background:var(--brand-pale)}
.check-row input{width:20px;height:20px;margin-top:4px;accent-color:var(--brand);flex-shrink:0;cursor:pointer}
.sub-field{margin-top:10px}
.sub-field span{display:block;font-size:14px;color:#555;margin-bottom:4px}

/* ===== 進むボタン ===== */
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.btn{font-family:var(--font);font-size:17px;font-weight:bold;border-radius:999px;padding:12px 30px;cursor:pointer;border:none}
.btn-back{background:#fff;color:#555;border:1.5px solid #bbb}
.btn-next{background:var(--brand);color:#fff;margin-left:auto}
.btn-next:hover{background:var(--brand-dark)}
.saved{text-align:center;font-size:13px;color:var(--sub);margin-top:14px}

/* ===== 指示文の画面 ===== */
.howto{background:var(--brand-pale);border-radius:10px;padding:14px 18px;margin:14px 0 6px}
.howto ol{padding-left:22px}
.blank-note{font-size:14px;color:#8a5a00;background:#fff6d9;border-radius:8px;padding:8px 12px;margin-top:10px}
.prompt-box{border:1.5px solid var(--line);border-radius:12px;padding:18px;margin-top:22px}
.prompt-box.zero{border-color:var(--brand)}
.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.prompt-title{font-size:18px;font-weight:bold}
.prompt-title .num{display:inline-block;background:var(--brand-dark);color:#fff;border-radius:8px;font-size:14px;padding:0 10px;margin-right:8px;vertical-align:2px}
.prompt-desc{font-size:14px;color:#555;margin-bottom:8px}
.copy-btn{font-family:var(--font);font-size:15px;font-weight:bold;background:var(--brand);color:#fff;border:none;border-radius:999px;padding:8px 22px;cursor:pointer}
.copy-btn.done{background:#e98b2a}
.prompt-text{width:100%;height:160px;font-family:var(--font);font-size:13px;line-height:1.6;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fafafa;color:#555;resize:vertical}
.title-fields{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.title-fields h3{font-size:16px;margin-bottom:4px}
.title-fields .q{margin-top:12px}
.title-fields .q-label{font-size:15px}
.memo-field{display:block;margin:6px 0 4px 16px}
.memo-field textarea{width:100%;font-family:var(--font);font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;line-height:1.6}
.memo-field textarea::placeholder{color:#b5b5b5}

/* ===== 原稿を貼る画面 ===== */
.paste-box{border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:20px}
.paste-box h3{font-size:18px;margin-bottom:6px}
.paste-text{width:100%;height:200px;font-family:var(--font);font-size:14px;line-height:1.6;padding:10px;border:1.5px solid var(--line);border-radius:8px;resize:vertical}
.paste-text:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-pale)}
.status{font-size:14px;margin-top:8px;line-height:1.7}
.status .ok{color:#2f7d32;font-weight:bold}
.status .ng{color:#b3261e;font-weight:bold}
.status .yk{color:#8a5a00;font-weight:bold}
.status ul{padding-left:20px;color:#8c1d18}
.status .yk-list{color:#6b4a00}
.mini-btn{font-family:var(--font);font-size:12px;font-weight:bold;background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand);border-radius:999px;padding:2px 10px;margin:2px 0;cursor:pointer;vertical-align:1px}
.mini-btn:hover{background:var(--brand-pale)}
.mini-btn.done{background:#e98b2a;border-color:#e98b2a;color:#fff}
.summary-box{border:2px solid var(--brand);border-radius:12px;padding:12px 16px;margin-top:16px;background:#fbfefd}
.summary-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.summary-list{list-style:none;font-size:15px;line-height:1.9}
.summary-list .ok{color:#2f7d32;font-weight:bold}
.summary-list .ng{color:#b3261e;font-weight:bold}
.summary-list .yk{color:#8a5a00;font-weight:bold}
.summary-time{font-size:12px;color:#888}
.alert .yk-list{padding-left:20px}

/* ===== 仕上げの画面 ===== */
.design-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px;margin-top:16px}
.design-grid label{display:flex;flex-direction:column;gap:4px;font-weight:bold;font-size:15px}
.design-grid input[type=text]{font-family:var(--font);font-size:15px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px}
.design-select{font-family:var(--font);font-size:15px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.design-grid input[type=color]{width:72px;height:40px;border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:2px;cursor:pointer}
.icon-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:normal}
.small-btn{font-family:var(--font);font-size:13px;background:#fff;border:1px solid #bbb;border-radius:999px;padding:4px 12px;cursor:pointer}
.chap-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 4px}
.chap-tabs button{font-family:var(--font);font-size:16px;font-weight:bold;padding:8px 18px;border-radius:999px;border:1.5px solid var(--brand);background:#fff;color:var(--brand-dark);cursor:pointer}
.chap-tabs button.on{background:var(--brand);color:#fff}
.chap-tabs button.empty{border-color:#ccc;color:#aaa}
.alert{border-radius:8px;padding:10px 14px;margin-top:10px;font-size:14px;line-height:1.7}
.alert ul{padding-left:20px}
.alert.ng{background:#fdecea;color:#8c1d18}
.alert.yk{background:#fff6d9;color:#8a5a00}
.alert.ok{background:#e8f5e9;color:#2f7d32}
.print-big{display:block;width:100%;margin-top:18px;font-family:var(--font);font-size:19px;font-weight:bold;padding:14px;border:none;border-radius:999px;background:var(--brand);color:#fff;cursor:pointer}
.print-big:hover{background:var(--brand-dark)}
.print-hint{font-size:13px;color:#666;margin-top:8px;text-align:center}
.link-btn{background:none;border:none;color:var(--brand-dark);text-decoration:underline;font-family:var(--font);font-size:14px;cursor:pointer;padding:0}

/* =====================================================
   特典のデザイン（見本.htmlの部品。#preview の中だけに効きます）
   ===================================================== */
#preview{
  --brand:#2f8f83;--brand-dark:#21645c;--brand-light:#97c7c1;--brand-pale:#eaf4f3;
  --on-brand:#fff;--on-dark:#fff;--text:#333;--sub:#777;--line:#ddd;
  display:none;background:#e6e6e6;padding:24px 0 60px;
  font-size:10.5pt;line-height:1.8;color:var(--text)
}
#preview.show{display:block}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.d-empty{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;padding:30px;text-align:center;font-size:16px;color:#666}
.d-page{width:210mm;height:297mm;margin:0 auto 24px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative;overflow:hidden;padding:20mm 18mm 26mm;display:flex;flex-direction:column}
.d-page::before{content:"";position:absolute;top:0;left:0;right:0;height:3mm;background:var(--brand)}
.d-page.d-tall{height:auto;min-height:297mm}
.d-body{flex:1;min-height:0;overflow:hidden}
.d-tall .d-body{overflow:visible}
.d-footer{position:absolute;left:18mm;right:18mm;bottom:10mm;display:flex;justify-content:space-between;align-items:center;gap:6mm;font-size:8pt;color:var(--sub);border-top:1.5px solid var(--brand-light);padding-top:2.5mm;line-height:1.5}
.d-footer .d-catch{flex:1;text-align:center;color:var(--brand-dark)}
.d-footer .d-no{white-space:nowrap}
.d-label{align-self:flex-start;background:var(--brand-pale);color:var(--brand-dark);font-weight:bold;font-size:9pt;padding:1mm 4mm;border-radius:999px;margin-bottom:3mm}
.d-body p{margin:0 0 3mm}
.d-h2{font-size:15pt;line-height:1.5;padding:0 0 2mm 4mm;border-left:2.5mm solid var(--brand);border-bottom:1px solid var(--brand-light);margin:2mm 0 5mm}
.d-h3{font-size:12pt;color:var(--brand-dark);margin:5mm 0 2mm;padding-left:6mm;position:relative;line-height:1.6}
.d-h3::before{content:"";position:absolute;left:0;top:.55em;width:3.5mm;height:3.5mm;border-radius:50%;background:var(--brand)}
.d-marker{background:linear-gradient(transparent 60%,var(--brand-light) 60%);font-weight:bold}
.d-yk{background:#ffe680;color:#7a4d00;font-weight:bold;padding:0 1mm;border-radius:1mm}
.d-flash{outline:3px solid #e9a23b;outline-offset:2px;border-radius:2px}
.d-bad{background:#fdecea;color:#b3261e;border:1px dashed #e8a29b;border-radius:1.5mm;padding:1mm 3mm}
.d-list{margin:0 0 3mm;padding-left:7mm}
.d-list li{margin-bottom:1.5mm}
.d-li-sub{display:block;font-size:9.5pt;color:#555;line-height:1.7}
.d-kyocho{background:var(--brand-pale);border:2px solid var(--brand);border-radius:4mm;padding:4.5mm 6mm;margin:4mm 0 5mm}
.d-kyocho-title{font-weight:bold;color:var(--brand-dark);font-size:12pt;margin-bottom:2mm}
.d-kyocho-title::before{content:"★ "}
.d-kyocho p:last-child,.d-kyocho .d-list:last-child{margin-bottom:0}
.d-avatar{border-radius:50%;background:#d4d4d4 center/cover no-repeat;border:1.2mm solid #fff;box-shadow:0 0 0 .7mm var(--brand-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#8a8a8a;font-size:8pt}
.d-avatar-lg{width:44mm;height:44mm;font-size:10pt}
.d-avatar-md{width:28mm;height:28mm}
.d-avatar-sm{width:20mm;height:20mm}
/* 言葉のまとまりで改行する（「ロードマッ／プ」のような改行を防ぐ） */
.d-phrase{word-break:auto-phrase}
/* 表紙：やわらかいグラデーション＋白っぽいカード */
.d-page.d-cover{padding:24mm 18mm 18mm;align-items:center;text-align:center;
  background:
    radial-gradient(circle at 88% 10%, rgba(255,255,255,.32) 0 17%, transparent 17.3%),
    radial-gradient(circle at 6% 88%, rgba(255,255,255,.18) 0 24%, transparent 24.3%),
    radial-gradient(circle at 96% 70%, rgba(255,255,255,.14) 0 10%, transparent 10.3%),
    linear-gradient(165deg, var(--cover-soft) 0%, var(--brand) 78%)}
.d-page.d-cover::before{display:none}
.d-cv-card{width:100%;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:6mm;padding:11mm 12mm 12mm;box-shadow:0 2mm 7mm rgba(0,0,0,.08);color:#2b2b2b}
.d-cv-badge{display:inline-block;background:var(--brand);color:var(--cover-ink);font-weight:bold;font-size:10pt;padding:1.2mm 6mm;border-radius:999px;letter-spacing:.05em}
.d-cv-main{font-weight:bold;line-height:1.5;margin-top:7mm;text-wrap:balance}
.d-cv-strong{color:var(--brand-ink)}
.d-cv-line{width:22mm;height:1mm;border-radius:1mm;background:var(--brand-light);margin:8mm auto 6mm}
.d-cv-chap{display:inline-block;border:1.5px solid var(--brand-ink);color:var(--brand-ink);font-weight:bold;font-size:10pt;padding:.8mm 5mm;border-radius:999px}
.d-cv-sub{font-size:12.5pt;font-weight:bold;line-height:1.7;margin-top:4mm;color:#3a3a3a;text-wrap:balance}
.d-cv-foot{margin:auto 0;display:flex;flex-direction:column;align-items:center;color:var(--cover-ink)}
.d-cv-foot .d-avatar{width:38mm;height:38mm;border-color:rgba(255,255,255,.95);box-shadow:0 1mm 4mm rgba(0,0,0,.12)}
.d-cv-catch{margin-top:6mm;font-size:13pt;font-weight:bold}
.d-cv-yago{margin-top:2mm;font-size:10.5pt}
/* 悩みの囲み */
.d-nayami{position:relative;background:var(--brand-pale);border-radius:4mm;padding:8mm 6mm 5mm 12mm;margin:4mm 0 5mm}
.d-nayami::before{content:"\201C";position:absolute;left:3mm;top:-3mm;font-size:42pt;line-height:1;color:var(--brand);font-family:Georgia,serif}
.d-nayami-item{background:#fff;border-radius:4mm;padding:1.8mm 5mm;margin-bottom:2.5mm;font-size:10pt;line-height:1.7}
.d-nayami-item:last-child{margin-bottom:0}
/* 自己紹介 */
.d-jiko{display:flex;gap:6mm;align-items:flex-start;border:1.5px solid var(--brand-light);border-radius:4mm;padding:5mm 6mm;margin:3mm 0 5mm}
.d-jiko-main{flex:1;min-width:0}
.d-jiko-name{font-size:13pt;font-weight:bold;color:var(--brand-dark);margin-bottom:1mm}
.d-jiko p{font-size:9.5pt;margin:0 0 2mm}
.d-jiko p:last-child{margin-bottom:0}
/* 比較カード */
.d-hikaku{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin:4mm 0 5mm}
.d-hcard{border-radius:4mm;overflow:hidden;border:1.5px solid var(--line)}
.d-hcard-head{padding:2.5mm 4mm;font-weight:bold;text-align:center;line-height:1.5}
.d-hcard-head small{display:block;font-size:8.5pt;font-weight:normal}
.d-hcard.a .d-hcard-head{background:#eee;color:#555}
.d-hcard.b{border-color:var(--brand)}
.d-hcard.b .d-hcard-head{background:var(--brand);color:var(--on-brand)}
.d-hcard ul{list-style:none;padding:3.5mm 4mm}
.d-hcard li{padding-left:5mm;position:relative;margin-bottom:1.5mm;font-size:10pt;line-height:1.6}
.d-hcard li::before{content:"×";position:absolute;left:0;color:#999;font-weight:bold}
.d-hcard.b li::before{content:"○";color:var(--brand)}
/* チェックリスト */
.d-check{border:1.5px solid var(--brand-light);border-radius:4mm;padding:4mm 5mm;margin:4mm 0 5mm}
.d-check-item{display:flex;gap:3mm;align-items:flex-start;padding:1.8mm 0;border-bottom:1px dashed var(--line);cursor:pointer}
.d-check-item input{width:5mm;height:5mm;accent-color:var(--brand);margin-top:1mm;flex-shrink:0}
.d-check-count{text-align:right;font-weight:bold;color:var(--brand-dark);margin:2mm 0 1mm}
.d-hantei{display:grid;gap:2mm}
.d-hantei-row{display:flex;gap:4mm;padding:2mm 4mm;border-radius:2mm;background:#f4f4f4;font-size:9.5pt;line-height:1.6}
.d-hantei-row b{color:var(--brand-dark);white-space:nowrap;min-width:16mm}
.d-hantei-row.active{background:var(--brand-pale);outline:1.5px solid var(--brand)}
/* 悪循環 */
.d-cycle{width:150mm;max-width:100%;margin:2mm auto 4mm;display:block}
.d-cyc-ring{fill:none;stroke:var(--brand-light);stroke-width:3;stroke-dasharray:6 5}
.d-cyc-arrow{fill:var(--brand)}
.d-cyc-center{fill:var(--brand-pale)}
.d-cyc-center-text{fill:var(--brand-dark);font-weight:bold}
.d-cyc-box{fill:#fff;stroke:var(--brand);stroke-width:2}
.d-cyc-text{fill:var(--text);font-weight:bold}
.d-cyc-num{fill:var(--brand)}
.d-cyc-num-text{fill:var(--on-brand);font-size:10px;font-weight:bold}
/* ステップカード */
.d-steps{display:grid;gap:6mm;margin:4mm 0 5mm}
.d-step{border:1.5px solid var(--brand-light);border-radius:4mm;padding:0 4mm 4mm;text-align:center;position:relative;background:#fff}
.d-step:not(:last-child)::after{content:"▶";position:absolute;right:-3mm;top:50%;transform:translate(50%,-50%);color:var(--brand);font-size:9pt}
.d-step-num{display:inline-block;background:var(--brand);color:var(--on-brand);font-weight:bold;padding:1mm 5mm;border-radius:0 0 3mm 3mm;font-size:9pt;margin-bottom:2mm}
.d-step-title{font-weight:bold;font-size:11pt;color:var(--brand-dark);margin-bottom:1.5mm;line-height:1.5}
.d-step p{font-size:9pt;text-align:left;margin:0;line-height:1.7}
/* 書き込み欄 */
.d-kaki{border:1.5px solid var(--brand);border-radius:4mm;margin:4mm 0 5mm;overflow:hidden}
.d-kaki-q{background:var(--brand-pale);padding:2.5mm 5mm;font-weight:bold;color:var(--brand-dark)}
.d-kaki-q::before{content:"✎ "}
.d-kaki-lines{margin:1mm 5mm 4mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(9mm - 1px),#bbb calc(9mm - 1px),#bbb 9mm)}
/* チャレンジ表 */
table.d-chal{width:100%;border-collapse:collapse;margin:4mm 0 5mm;font-size:9.5pt}
.d-chal th{background:var(--brand);color:var(--on-brand);padding:2mm;border:1px solid var(--brand)}
.d-chal td{border:1px solid var(--brand-light);padding:2mm 3mm;height:10.5mm;line-height:1.5}
.d-chal td.day{background:var(--brand-pale);font-weight:bold;text-align:center;color:var(--brand-dark);width:17mm}
.d-chal td.done{width:18mm;text-align:center;color:var(--brand-light);font-size:13pt}
.d-chal td.memo{width:40mm}
/* 私自身の場合 */
.d-watashi{display:flex;gap:5mm;align-items:flex-start;background:var(--brand-pale);border-radius:4mm;padding:5mm;margin:4mm 0 5mm}
.d-watashi-body{background:#fff;border-radius:3mm;padding:3.5mm 5mm;position:relative;flex:1;min-width:0}
.d-watashi-body::before{content:"";position:absolute;left:-3mm;top:6mm;border:2mm solid transparent;border-right:3mm solid #fff;border-left:0}
.d-watashi-label{font-weight:bold;color:var(--brand-dark);margin-bottom:1mm}
.d-watashi-body p{font-size:9.5pt;margin:0 0 2mm}
.d-watashi-body p:last-child{margin-bottom:0}
/* 案内カード */
.d-annai{border:2px solid var(--brand);border-radius:5mm;overflow:hidden;margin:5mm 0}
.d-annai-head{background:var(--brand);color:var(--on-brand);text-align:center;padding:4mm;font-size:14pt;font-weight:bold;line-height:1.5}
.d-annai-head small{display:block;font-size:9.5pt;font-weight:normal}
.d-annai-body{padding:4mm 7mm 5mm}
.d-annai-row{display:flex;gap:4mm;padding:2.5mm 0;border-bottom:1px dashed var(--line)}
.d-annai-row:last-child{border-bottom:none}
.d-annai-row dt{width:30mm;flex-shrink:0;font-weight:bold;color:var(--brand-dark)}
.d-annai-row dd{flex:1}
.d-annai-row ul{padding-left:5mm}
.d-annai-row.stack{flex-direction:column;gap:1mm}
.d-annai-row.stack dt{width:auto}
.d-annai-ol{list-style:none;counter-reset:ann;padding:0;margin:1mm 0 0}
.d-annai-ol li{counter-increment:ann;position:relative;padding-left:8mm;margin:1.8mm 0;line-height:1.7}
.d-annai-ol li::before{content:counter(ann);position:absolute;left:0;top:.25em;width:5.5mm;height:5.5mm;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:8.5pt;font-weight:bold;display:flex;align-items:center;justify-content:center;line-height:1}
/* 受け取り方 */
.d-uketori{display:flex;align-items:stretch;gap:3mm;margin:4mm 0}
.d-uketori-step{flex:1;border:1.5px solid var(--brand-light);border-radius:4mm;padding:4mm 3mm;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2mm}
.d-uketori-num{width:10mm;height:10mm;border-radius:50%;background:var(--brand);color:var(--on-brand);font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:12pt}
.d-uketori-text{font-size:10pt;font-weight:bold;line-height:1.6}
.d-uketori-arrow{align-self:center;color:var(--brand);font-size:12pt}
.d-chui{display:flex;gap:3mm;align-items:flex-start;background:#fff4e5;border:1.5px solid #e9a23b;border-radius:3mm;padding:3mm 5mm;margin:3mm 0 4mm;font-size:10pt}
.d-chui-mark{flex-shrink:0;width:6mm;height:6mm;border-radius:50%;background:#e9a23b;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:9pt;margin-top:.8mm}
/* 期限の帯 */
.d-kigen-wrap{margin:5mm 0;text-align:center}
.d-kigen-lead{font-size:10pt;margin-bottom:2mm}
.d-kigen{display:inline-flex;align-items:center;gap:4mm;background:var(--brand-dark);color:var(--on-dark);border-radius:999px;padding:3.5mm 9mm;font-weight:bold;font-size:12.5pt;box-shadow:0 1.2mm 0 rgba(0,0,0,.2)}
.d-kigen .tag{background:#fff;color:var(--brand-dark);border-radius:999px;padding:.3mm 3mm;font-size:9pt}
/* 締めのページ */
.d-page.d-closing{background:var(--brand-pale);justify-content:center;align-items:center;text-align:center}
.d-closing-card{background:#fff;border-radius:6mm;padding:12mm 14mm;width:100%;display:flex;flex-direction:column;align-items:center;box-shadow:0 1mm 4mm rgba(0,0,0,.06)}
.d-closing-title{font-size:15pt;font-weight:bold;color:var(--brand-dark);margin:7mm 0 5mm;line-height:1.6}
.d-closing-card p{text-align:left;font-size:10.5pt;margin:0 0 3mm;align-self:stretch}
.d-closing-sign{margin-top:4mm;align-self:flex-end;text-align:right;font-weight:bold}
.d-closing-sign small{display:block;font-weight:normal;color:var(--sub);font-size:9pt}
.d-closing-catch{margin-top:8mm;font-size:12pt;font-weight:bold;color:var(--brand-dark)}

/* ===== 完成形の画面で直す（画面だけ。印刷には出ない） ===== */
.ed{outline:none}
@media screen{
  #preview .ed{cursor:text;border-radius:2px;transition:outline-color .15s}
  #preview .ed:hover{outline:1.5px dashed rgba(0,0,0,.28);outline-offset:2px}
  #preview .ed:focus{outline:2px solid #e9a23b;outline-offset:2px;background:rgba(255,236,170,.35)}
}
.pv-bar{position:sticky;top:0;z-index:5;width:210mm;max-width:calc(100% - 16px);margin:0 auto 16px;background:#fff8e1;border:1.5px solid #e9c46a;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-family:var(--font);font-size:14px;line-height:1.6;color:#5a4300;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.pv-undo{font-family:var(--font);font-size:14px;font-weight:bold;white-space:nowrap;background:#fff;border:1.5px solid #c99a2e;color:#7a5600;border-radius:999px;padding:5px 16px;cursor:pointer}
.pv-undo:disabled{opacity:.45;cursor:default}

/* ===== 印刷するとき：特典のページだけを出す ===== */
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  body > *:not(#preview){display:none !important}
  #preview{display:block !important;padding:0;background:none;overflow:visible}
  .pv-bar{display:none !important}
  .ed{outline:none !important;background:none !important}
  .d-page{margin:0;box-shadow:none;break-after:page}
  .d-page:last-child{break-after:auto}
}

<body>

<div class="header">
  <div class="header-inner">
    <div class="app-title">LINE特典メーカー</div>
    <button class="reset-btn" id="btnReset">最初からやり直す</button>

<!-- 使い方（画面だけ。印刷には出ない） -->
<div class="intro">

<!-- 特典のページ（仕上げの画面で表示。印刷されるのはここだけ） -->

<!-- いちばん下：作った人とバージョン（画面だけ） -->
<div class="credit">作成：げんげん（合同会社エバマン）　<span id="appVersion"></span></div>

<script>
// ツールのバージョン（直して配りなおすときは、ここの数字を上げる）
var APP_VERSION = "ver1.3";
document.getElementById("appVersion").textContent = APP_VERSION;

// 「個別相談で得られること」の選択肢
var CONSULT_OPTIONS = [

// 何も選ばず空欄のときに使う、基本の型
var CONSULT_DEFAULT = [
  "今の状態を一緒に確認する",
  "つまずいているところを整理する",
  "最初の一歩を一緒に考える"
];

// =====================================================
// 質問の一覧
// ex … 薄い文字で出す「答え方の例」（架空の整理収納アドバイザー）

var STEPS = [

      { id: "yago", label: "屋号（お店や教室の名前）", ex: "くらし整えラボ" },
      { id: "katagaki", label: "肩書き", ex: "整理収納アドバイザー" },
      { id: "pronoun", label: "文章の中での一人称（自分の呼び方）", select: ["私", "僕", "わたし"] },
      { id: "service", label: "どんな人に、何をしていますか？", area: 3,

  {

    lead: "あなたのお客様が、どんなことで困っているかを教えてください。",
    qs: [
      { id: "target", label: "あなたのお客様は、どんな人ですか？", area: 2,
        ex: "仕事と子育てで毎日バタバタしている、30〜40代の女性" },
      { id: "effort", label: "お客様は、何をがんばっているのに、うまくいっていませんか？", area: 2,
        ex: "休みの日に一気に片づけているのに、3日で元に戻ってしまう" },
      { id: "scenes", label: "よくある悩みの場面を3〜4つ", hint: "1行に1つずつ書いてください", area: 5,
        ex: "急な来客のとき、あわてて物を押し入れに押しこむ\n朝、鍵やスマホが見つからずバタバタする\n同じ物をうっかり2つ買ってしまう\n家族に「あれどこ？」と何度も聞かれる" },
      { id: "belief", label: "お客様は「うまくいかない理由」を何だと思いこんでいますか？", area: 2,
        ex: "自分がずぼらな性格だから。片づけのセンスがないから。" }
    ]
  },
  {
    name: "本当の原因とあなたの方法",
    lead: "お客様が気づいていない「本当の原因」と、あなたの解決の方法を教えてください。",
    qs: [
      { id: "cause", label: "本当の原因は何ですか？", area: 2,
        ex: "性格ではなく、物の「置き場所」が決まっていないこと" },
      { id: "method", label: "あなたの方法に名前をつけると？", ex: "おうち整え3ステップ" },
      { label: "あなたの方法の3つのステップ", hint: "ステップの名前と、かんたんな説明",
        sub: [
          { id: "step1", label: "STEP1", ex: "よく使う物を知る（毎日使う物を書き出す）" },
          { id: "step2", label: "STEP2", ex: "置き場所を決める（使う場所のすぐ近くに）" },
          { id: "step3", label: "STEP3", ex: "戻すしくみをつくる（1日5分で戻せる流れ）" }
        ] },
      { id: "relapse", label: "一度よくなっても、元に戻ってしまう理由は？", area: 2,
        ex: "家族の物が増えたり、生活が変わったりしたときに、しくみを見直さないから" }
    ]
  },
  {
    name: "あなたの実績とストーリー",
    lead: "あなた自身のことを教えてください。",
    note: "ここはAIに作らせない、大事な部分です。分からない所は空欄のままでOK。特典には「（要確認）」と出るので、あとから書き足せます。",
    qs: [
      { id: "career", label: "活動年数や、サポートした人数など", area: 2,
        ex: "活動5年目。これまで約120名をサポート（※架空の例です）" },
      { label: "あなた自身の体験",
        sub: [
          { id: "storyBefore", label: "困っていたこと", area: 2, ex: "週末に半日かけて片づけても、水曜日には元どおり。そのたびに自分を責めていた。" },
          { id: "storyTrigger", label: "変わるきっかけ", area: 2, ex: "整理収納の講座で「置き場所が決まっていないだけ」と言われたこと。" },
          { id: "storyNow", label: "今", area: 2, ex: "1日5分のリセットだけで、急な来客でもあわてなくなった。" }
        ] },
      { id: "voice", label: "お客様の変化の例", area: 3,
        ex: "「毎週末の片づけがいらなくなった」「家族が自分で物を戻すようになった」（40代・会社員の方）" }
    ]
  },
  {
    name: "最後の案内",
    lead: "4本の特典を読んでくださった方に、最後にご案内する内容を教えてください。",
    note: "申込方法（フォームでチェック → 送信 → 日程をLINEでご案内）と期限（7日後の23:59まで）は、決まった文章で自動で入ります。",
    qs: [
      { id: "consultName", label: "ご案内するものの呼び方", select: ["無料個別相談", "体験セッション", "説明会"] },
      { id: "consult", label: "個別相談（無料コンサル）を受けると、お相手は何を得られますか？",

        freeLabel: "ほかにあれば、自由に書いてください", area: 3,

        ex: "何度片づけても元に戻ってしまう人\n家族が片づけに協力してくれない人\n片づけにかける時間を減らしたい人" },
      { id: "product", label: "そのあとにご案内する、商品の内容と金額", hint: "タイトルを考えるときの参考にします。特典の原稿に金額は出ません", area: 3,
        ex: "おうち整え3か月サポート（オンライン面談6回＋LINE相談）198,000円（税込）※架空の例です" }

  { name: "指示文をつくる", prompts: true },
  { name: "原稿を貼る", paste: true },
  { name: "仕上げてPDFにする", finish: true }
];

var TITLE_FIELDS = [
  { id: "tAll", label: "メインタイトル（全体タイトル）" },
  { id: "t0", label: "序章のタイトル" },
  { id: "t1", label: "第1章のタイトル" },
  { id: "t2", label: "第2章のタイトル" },
  { id: "t3", label: "第3章のタイトル" }
];

// =====================================================
// 保存と読みこみ（使えないブラウザでも止まらないようにしています）
// =====================================================
var SAVE_KEY = "line-tokuten-tool";
var answers = {};
var stepIndex = 0;
try {
  var saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
  answers = saved.answers || {};
  stepIndex = saved.step || 0;
} catch (e) {}
if (stepIndex < 0 || stepIndex >= STEPS.length) stepIndex = 0;

function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ answers: answers, step: stepIndex })); } catch (e) {}
}

// =====================================================
// 画面を作る
// =====================================================
var card = document.getElementById("card");
var preview = document.getElementById("preview");

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function fieldHtml(f){
  var val = esc(answers[f.id] || "");
  if (f.select) {
    return '<select data-id="' + f.id + '">' + f.select.map(function(o){
      return '<option' + (answers[f.id] === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join("") + '</select>';
  }
  var ph = esc("例）" + f.ex);
  if (f.area) {
    return '<textarea rows="' + f.area + '" data-id="' + f.id + '" placeholder="' + ph + '">' + val + '</textarea>';
  }
  return '<input type="text" data-id="' + f.id + '" value="' + val + '" placeholder="' + ph + '">';
}

function renderQuestions(step){
  var html = '<div class="step-title">' + step.name + '</div>';
  html += '<div class="step-lead">' + step.lead + '<br>分からない質問は、空欄のまま進んでOKです。</div>';
  if (step.note) html += '<div class="step-note">' + step.note + '</div>';
  // 1画面目だけ：勉強会のデモ・練習用に、例をまとめて入れるボタン
  if (stepIndex === 0) {
    html += '<div class="demo-box"><button class="demo-btn" id="btnDemo">例を入れて試してみる</button>' +
      '<span class="demo-text">' + (demoJustFilled ? '<b class="demo-done">✓ 例を入れました。「次へ」で進んでみてください。</b>' :
        "勉強会の練習用です。架空の整理収納アドバイザー（春野 ゆい／くらし整えラボ）の答えが入ります。") + "</span></div>";
    demoJustFilled = false;
  }
  step.qs.forEach(function(q, i){
    html += '<div class="q"><label class="q-label"><span class="num">質問' + (i + 1) + '</span>' + q.label + '</label>';
    if (q.hint) html += '<div class="q-hint">' + q.hint + '</div>';
    if (q.checks) {
      var picked = answers[q.checks.id] || [];
      html += '<div class="checks">' + q.checks.options.map(function(o){
        return '<label class="check-row"><input type="checkbox" data-check="' + q.checks.id + '" value="' + esc(o) + '"' +
          (picked.indexOf(o) >= 0 ? ' checked' : '') + '><span>' + esc(o) + '</span></label>';
      }).join("") + '</div>';
      html += '<label class="sub-field"><span>' + q.freeLabel + '</span>' + fieldHtml(q) + '</label>';
    } else if (q.sub) {
      q.sub.forEach(function(s){
        html += '<label class="sub-field"><span>' + s.label + '</span>' + fieldHtml(s) + '</label>';
      });
    } else {
      html += fieldHtml(q);
    }
    html += '</div>';
  });
  card.innerHTML = html;
}

function renderPrompts(){
  var blanks = countBlanks();
  var html = '<div class="step-title">指示文をつくる</div>';
  html += '<div class="howto"><ol>' +
    '<li>「0番」をコピーして、お使いのClaudeかChatGPT（無料版でもOK）の<b>新しいチャット</b>に貼りつけて送ります。</li>' +
    '<li>AIが「どの案にしますか？」と聞いてくるので、選んだ番号や直してほしい所を送ります。最後に章タイトルの表が出てきます。</li>' +
    '<li>決まったメインタイトルと4つの章タイトルを、下の5つの欄に貼りつけます。</li>' +
    '<li>「1番」〜「4番」を、<b>1つずつ新しいチャット</b>に貼りつけて送ると、各章の原稿ができます。</li>' +
    '<li>原稿が途中で止まったら、同じチャットで「続き」と送ってください。</li>' +
    '</ol></div>';
  if (blanks > 0) {
    html += '<div class="blank-note">空欄の質問が ' + blanks + ' 個あります。その部分は、原稿に「（要確認）」と出ます。あとで書き足せばOKです。</div>';
  }

  html += promptBoxHtml(0, "タイトルを決める", "AIと相談しながら、メインタイトルと4つの章タイトルを決めます（プロライン流）。", true);
  html += '<div class="title-fields"><h3>決めたタイトルと内容メモを貼りつけてください</h3>' +
    '<div class="q-hint">ここに入れたタイトルが、1〜4番の指示文に自動で入ります。空欄のタイトルは、原稿に「（要確認）」と出ます。<br>' +

// 指示文の箱（閉じタグ </div> は呼び出し側で付けます）
function promptBoxHtml(n, title, desc, isZero){
  return '<div class="prompt-box' + (isZero ? ' zero' : '') + '">' +
    '<div class="prompt-head"><div class="prompt-title"><span class="num">' + n + '番</span>' + title + '</div>' +
    '<button class="copy-btn" data-copy="' + n + '">コピーする</button></div>' +
    '<div class="prompt-desc">' + desc + '</div>' +
    '<textarea class="prompt-text" readonly data-prompt="' + n + '"></textarea>';
}

function updatePrompts(){
  document.querySelectorAll("[data-prompt]").forEach(function(ta){
    ta.value = buildPrompt(Number(ta.getAttribute("data-prompt")));
  });
}

function countBlanks(){
  var n = 0;
  STEPS.forEach(function(step){
    (step.qs || []).forEach(function(q){
      (q.sub || [q]).forEach(function(f){
        if (f.select) return;
        if (f.checks && (answers[f.checks.id] || []).length) return;
        if (!(answers[f.id] || "").trim()) n++;
      });
    });
  });
  return n;
}

function render(){
  var step = STEPS[stepIndex];
  preview.classList.remove("show");
  // 「元に戻す」は仕上げの画面の中だけ（原稿の欄で直したあとに古い中身へ戻さないように）
  if (!step.finish) undoStack = [];
  if (step.prompts) renderPrompts();
  else if (step.paste) renderPaste();
  else if (step.finish) renderFinish();
  else renderQuestions(step);

  document.getElementById("progCount").textContent = (stepIndex + 1) + " / " + STEPS.length;
  document.getElementById("progName").textContent = step.name;
  document.getElementById("progFill").style.width = ((stepIndex + 1) / STEPS.length * 100) + "%";
  document.getElementById("progDots").innerHTML = STEPS.map(function(s, i){
    return '<button data-go="' + i + '" class="' + (i === stepIndex ? 'now' : '') + '">' + (i + 1) + '</button>';
  }).join("");

  document.getElementById("btnBack").style.visibility = stepIndex === 0 ? "hidden" : "visible";
  document.getElementById("btnNext").style.display = stepIndex === STEPS.length - 1 ? "none" : "";
  var next = STEPS[stepIndex + 1];
  document.getElementById("btnNext").textContent =
    !next ? "" : next.prompts ? "指示文をつくる →" : next.paste ? "原稿を貼る →" : next.finish ? "仕上げる →" : "次へ →";
  save();
}

function go(i){
  stepIndex = i;
  render();
  window.scrollTo(0, 0);
}

card.addEventListener("input", function(e){
  var checkId = e.target.getAttribute("data-check");
  var id = e.target.getAttribute("data-id");
  if (checkId) {
    answers[checkId] = Array.prototype.map.call(
      card.querySelectorAll('[data-check="' + checkId + '"]:checked'),
      function(el){ return el.value; });
  } else if (id) {
    answers[id] = e.target.value;
  } else {
    return;
  }
  save();
  var step = STEPS[stepIndex];
  if (step.prompts) updatePrompts();
  if (step.paste && /^m\d$/.test(id || "")) updatePasteStatus(Number(id.charAt(1)));
  if (step.finish) scheduleLayout();
});

// 例を入れて試してみる（薄い文字で出している例を、そのまま答えに入れる）
// =====================================================
var demoJustFilled = false;
function fillExample(){
  if (!confirm("今入っている答えは、例で上書きされます。よろしいですか？")) return;
  STEPS.forEach(function(step){
    (step.qs || []).forEach(function(q){
      (q.sub || [q]).forEach(function(f){
        if (f.id && f.ex != null && !f.select) answers[f.id] = f.ex;
      });
      // 「得られること」は、例の文だけにそろえる（チェックは外す）
      if (q.checks) answers[q.checks.id] = [];
    });
  });
  save();
  demoJustFilled = true;
  go(0);
}

card.addEventListener("click", function(e){
  if (e.target.closest("#btnDemo")) { fillExample(); return; }
  var btn = e.target.closest("[data-copy]");
  if (!btn) return;
  copyText(buildPrompt(Number(btn.getAttribute("data-copy"))), btn);
});

document.getElementById("progDots").addEventListener("click", function(e){
  var b = e.target.closest("[data-go]");
  if (b) go(Number(b.getAttribute("data-go")));
});
document.getElementById("btnBack").addEventListener("click", function(){ if (stepIndex > 0) go(stepIndex - 1); });
document.getElementById("btnNext").addEventListener("click", function(){ if (stepIndex < STEPS.length - 1) go(stepIndex + 1); });
document.getElementById("btnReset").addEventListener("click", function(){
  if (!confirm("入力した答えをすべて消して、最初からやり直しますか？\n（元に戻せません）")) return;
  answers = {};
  go(0);
});

function copyText(text, btn){
  var label = btn.textContent;
  function done(){
    btn.textContent = "コピーしました！";
    btn.classList.add("done");
    setTimeout(function(){ btn.textContent = label; btn.classList.remove("done"); }, 2000);
  }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) done();
    else alert("うまくコピーできませんでした。\n指示文の欄をクリックして、Ctrl＋A（すべて選択）→ Ctrl＋C（コピー）を押してください。");
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
}

function v(id){ return (answers[id] || "").trim(); }
function a(id){ return v(id) || "（未回答）"; }
function lines(id){
  var t = v(id);
  if (!t) return "（未回答）";
  return "\n" + t.split(/\n+/).map(function(s){ return "　- " + s.trim(); }).filter(function(s){ return s.length > 3; }).join("\n");
}
// 呼び方（無料個別相談／体験セッション／説明会）
function cname(){ return v("consultName") || "無料個別相談"; }
// 一人称（私／僕／わたし）
function pronoun(){ return v("pronoun") || "私"; }
// 個別相談で得られること（選んだ項目＋自由に書いた内容）。空欄なら null
function consultItems(){
  var items = (answers.consultPicks || []).slice();
  v("consult").split(/\n+/).forEach(function(s){ if (s.trim()) items.push(s.trim()); });
  return items.length ? items : null;
}
// 案内カードの「お話しすること」：空欄なら基本の型
function talkItems(){ return consultItems() || CONSULT_DEFAULT; }
// 「無料」をつけた呼び方（無料個別相談は、そのまま）
function freeName(cn){ return /^無料/.test(cn) ? cn : "無料" + cn; }
// 「お話しすること」を番号つきの箇条（3〜5個）で書いてもらうための指示
function talkSpec(){
  var items = talkItems().slice();
  var hasFree = !!v("consult") && (answers.consultPicks || []).length > 0;
  // 1〜2個しかないときは、基本の型から重ならないものを足して3個にする
  if (items.length < 3) {
    CONSULT_DEFAULT.forEach(function(d){
      if (items.length >= 3) return;
      var key = d.slice(0, 4);
      if (!items.some(function(it){ return it.indexOf(key) >= 0; })) items.push(d);
    });
  }
  if (items.length <= 5 && !hasFree) {
    return ["　　（このあと、次の" + items.length + "つを番号つきの箇条で書く。「／」でつなげない）"].concat(
      items.map(function(s, k){ return "　　" + (k + 1) + ". " + s; }));
  }
  return ["　　（このあと、次の内容を、似ているものはまとめて3〜5個の番号つきの箇条にして書く。「1. 」から始め、6個以上にしない。「／」でつなげない）"].concat(
    items.map(function(s){ return "　　　- " + s; }));
}
// 「こんな方におすすめ」：空欄なら、お客様の悩みから5つ作ってもらう

  if (v("recommend")) {
    return "　まず「こんな方におすすめ」を【強調】で番号付きで書く（回答の「こんな方におすすめ」を使う）。";

  return "　まず「こんな方におすすめ」を【強調】で番号付きで5つ書く。回答が空欄なので、回答の「お客様の悩み」（お客様はどんな人か・がんばっているのにうまくいかないこと・よくある悩みの場面・思いこんでいる理由）をもとに5つ作る。";
}

  var items = consultItems();
  return items ? "\n" + items.map(function(s){ return "　- " + s; }).join("\n") : "（未回答）";
}

// =====================================================
// 原稿を読み取る（記号 → 部品）
// うっかりミスがあっても止まらず、ふつうの文章として表示します
// =====================================================
var CH_NAMES = ["序章", "第1章", "第2章", "第3章"];
var BLOCK_TAGS = ["表紙","強調","悩み","自己紹介","比較","チェック","悪循環","ステップ","書き込み","チャレンジ表","私自身の場合","案内","受け取り方","期限","締め"];
var LINE_TAGS = ["章","見出し","小見出し","改ページ"];

function trimAll(s){ return s.replace(/^[\s　]+|[\s　]+$/g, ""); }

function parseManuscript(text){
  var L = text.replace(/\r\n?/g, "\n").split("\n").map(trimAll);
  // 1行ずつ { s: 文字, n: 原稿の何行目か（0から） } の形で持つ。完成形の画面で直した文字を、原稿の同じ行に戻すため
  var blocks = [], warns = [], plain = [], i = 0;
  function flushPlain(){
    if (plain.some(function(x){ return x.s; })) blocks.push({ type: "text", body: plain });
    plain = [];
  }
  function isTagLine(s){
    var m = s.match(/^【([^】\/]+)】/);
    if (!m) return false;
    var n = m[1].trim();
    return BLOCK_TAGS.indexOf(n) >= 0 || LINE_TAGS.indexOf(n) >= 0;
  }
  while (i < L.length) {
    var t = L[i];
    var close = t.match(/^【\/([^】]+)】$/);
    var open = t.match(/^【([^】\/]+)】(.*)$/);
    if (close) {
      flushPlain();
      warns.push({ kind: "stray", name: close[1], line: i + 1, msg: "【/" + close[1] + "】に対応する始まりの記号がありません" });
      blocks.push({ type: "bad", text: t, n: i });
      i++; continue;
    }
    if (open && open[1].trim() !== "マーカー") {
      var name = open[1].trim(), rest = trimAll(open[2]);
      if (LINE_TAGS.indexOf(name) >= 0) {
        flushPlain();
        blocks.push({ type: name, text: rest, n: i });
        i++; continue;
      }
      if (BLOCK_TAGS.indexOf(name) >= 0) {
        var found = -1, stop = L.length;
        for (var j = i + 1; j < L.length; j++) {
          if (L[j] === "【/" + name + "】") { found = j; break; }
          // 次の見出し・改ページ・ほかの部品の記号が来たら、そこで止める
          if (isTagLine(L[j]) || /^【\/[^】]+】$/.test(L[j])) { stop = j; break; }
        }
        flushPlain();
        if (found < 0) {
          // 閉じ忘れ：次の見出しなどの手前までを、その部品として表示する（警告は出す）
          warns.push({ kind: "unclosed", name: name, line: i + 1,
            msg: "【" + name + "】の終わりの記号【/" + name + "】が見つかりません（次の見出しなどの手前までを【" + name + "】として表示しています）" });
        }
        var end = found >= 0 ? found : stop;
        // テンプレートの「本文」という行がそのまま残っていたら無視
        var body = [];
        for (var q = i + 1; q < end; q++) if (L[q] !== "本文") body.push({ s: L[q], n: q });
        while (body.length && !body[body.length - 1].s) body.pop();
        // 記号と同じ行に書かれた文字は、記号をこわさないように直せない扱いにする
        if (rest) body.unshift({ s: rest, n: i, ro: true });
        var prev = blocks[blocks.length - 1];
        // 【悩み】が1行ずつ別々に書かれていたら、1つの囲みにまとめる
        if (name === "悩み" && prev && prev.type === "悩み") prev.body = prev.body.concat(body);
        else blocks.push({ type: name, body: body });
        i = found >= 0 ? found + 1 : stop; continue;
      }
      flushPlain();
      warns.push({ kind: "unknown", name: name, line: i + 1, msg: "【" + name + "】は知らない記号です" });
      blocks.push({ type: "bad", text: t, n: i });
      i++; continue;
    }
    plain.push({ s: t, n: i });
    i++;
  }
  flushPlain();
  return { blocks: blocks, warns: warns };
}

function countYk(text){ return (text.match(/（要確認|\(要確認/g) || []).length; }

// （要確認）がある行の一覧：何行目に、どんな文章か
function ykLines(text){
  var out = [];
  text.replace(/\r\n?/g, "\n").split("\n").forEach(function(s, i){
    if (/（要確認|\(要確認/.test(s)) out.push({ line: i + 1, text: trimAll(s) });
  });
  return out;
}

// 1つの章をまとめてチェックする（どの画面もこれを使う）
function checkChapter(idx){
  var text = answers["m" + idx] || "";
  if (!text.trim()) return { empty: true, warns: [], yk: [], ykCount: 0 };
  return { empty: false, warns: parseManuscript(text).warns, yk: ykLines(text), ykCount: countYk(text) };
}

// AIに直してもらうための文
function warnRequest(w){
  if (w.kind === "unclosed") return w.line + "行目あたりで、【" + w.name + "】の終わりの記号【/" + w.name + "】が抜けています。正しい位置に記号を入れて";
  if (w.kind === "stray") return w.line + "行目に、始まりの記号がない【/" + w.name + "】があります。正しい位置に始まりの記号【" + w.name + "】を入れるか、いらなければ消して";
  return w.line + "行目に、記号のルールにない【" + w.name + "】があります。ルールにある記号（【強調】など）に直すか、記号をはずして";
}
function fixRequest(idx, ws){
  var head;
  if (ws.length === 1) {
    head = "次の原稿の" + warnRequest(ws[0]) + "、原稿全体をもう一度出してください。中身の文章は変えないでください。";
  } else {
    head = "次の原稿に、記号のまちがいが" + ws.length + "か所あります。\n" +
      ws.map(function(w){ return "・" + warnRequest(w) + "ください。"; }).join("\n") +
      "\nそれぞれ直して、原稿全体をもう一度出してください。中身の文章は変えないでください。";
  }
  return head + "\n\n" + (answers["m" + idx] || "");
}

function warnListHtml(idx, ws){
  return "<ul>" + ws.slice(0, 8).map(function(w, k){
    return "<li>" + w.line + "行目：" + esc(w.msg) +
      ' <button class="mini-btn" data-fix="' + idx + ":" + k + '">AIに直してもらう文をコピー</button></li>';
  }).join("") + (ws.length > 8 ? "<li>ほか " + (ws.length - 8) + " か所</li>" : "") + "</ul>" +
    (ws.length > 1 ? '<button class="mini-btn" data-fix="' + idx + ':all">' + ws.length + "か所をまとめて直してもらう文をコピー</button>" : "");
}

// 文中の飾り：マーカーと（要確認）
function inl(s){
  return esc(s)
    .replace(/【マーカー】([\s\S]*?)【\/マーカー】/g, '<span class="d-marker">$1</span>')
    .replace(/(（要確認[^）]*）|\(要確認[^)]*\))/g, '<span class="d-yk">$1</span>');
}

// =====================================================
// 完成形の画面で直せる文字（原稿の何行目の、どの部分かを覚えておく）
// mode … whole:行まるごと／tag:【見出し】のあと／item:番号や「・」のあと／
//        after:「〇〇：」のあと／key:「：」の前／pipe:「：」のあとを「｜」で分けたk番目／slash:「／」で分けたk番目
// =====================================================
var CE_MODE = (function(){ var d = document.createElement("div"); d.contentEditable = "plaintext-only"; return d.contentEditable === "plaintext-only" ? "plaintext-only" : "true"; })();
function ed(lo, html, mode, k){
  if (!lo || lo.ro || lo.n == null) return html;
  return '<span class="ed" contenteditable="' + CE_MODE + '" spellcheck="false" data-ln="' + lo.n + '" data-m="' + mode + '"' +
    (k != null ? ' data-k="' + k + '"' : "") + ">" + html + "</span>";
}
// 0番の欄やデザインの欄に保存する文字（表紙のタイトル・キャッチコピー・屋号）
function edf(field, html){
  return '<span class="ed" contenteditable="' + CE_MODE + '" spellcheck="false" data-f="' + field + '">' + html + "</span>";
}

// ふつうの文章：段落・番号つきリスト・「・」のリスト（段落ごとに分けて返す）
function richChunks(lines){
  var out = [], para = [], list = null, prevBlank = true;
  function endPara(){
    if (para.length) { out.push("<p>" + para.map(function(x){ return ed(x, inl(x.s), "whole"); }).join("<br>") + "</p>"); para = []; }
  }
  function endList(){
    if (!list) return;
    out.push("<" + list.tag + ' class="d-list"' + (list.start > 1 ? ' start="' + list.start + '"' : "") + ">" +
      list.items.map(function(it){
        return "<li>" + ed(it.lo, inl(it.main), "item") + (it.sub.length ? '<span class="d-li-sub">' +
          it.sub.map(function(x){ return ed(x, inl(x.s), "whole"); }).join("<br>") + "</span>" : "") + "</li>";
      }).join("") + "</" + list.tag + ">");
    list = null;
  }
  lines.forEach(function(x){
    var s = x.s;
    if (!s) { endPara(); prevBlank = true; return; }
    var mo = s.match(/^(\d{1,2})[\.．、\)）]\s*(.*)$/);
    var mb = s.match(/^[・•]\s*(.*)$/);
    if (mo || mb) {
      endPara();
      var tag = mo ? "ol" : "ul";
      if (!list || list.tag !== tag) { endList(); list = { tag: tag, items: [], start: mo ? Number(mo[1]) : 1 }; }
      list.items.push({ main: mo ? mo[2] : mb[1], lo: x, sub: [] });
      prevBlank = false; return;
    }
    // 番号の項目のすぐ下の行は、その項目の説明として扱う
    if (list && !prevBlank) { list.items[list.items.length - 1].sub.push(x); return; }
    endList();
    para.push(x);
    prevBlank = false;
  });
  endPara(); endList();
  return out;
}
function rich(lines){ return richChunks(lines).join(""); }

// 「タイトル：〜」のような行を取り出す（f：文字、fl：その行）
function takeFields(body, keys){
  var f = {}, fl = {}, rest = [];
  body.forEach(function(x){
    var m = x.s.match(/^([^：:]{1,15})[：:]\s*(.*)$/);
    if (m && keys.indexOf(trimAll(m[1])) >= 0) { f[trimAll(m[1])] = m[2]; fl[trimAll(m[1])] = x; }
    else rest.push(x);
  });
  return { f: f, fl: fl, rest: rest };
}
function nonBlank(body){ return body.filter(function(x){ return x.s; }); }
function stripBullet(s){ return s.replace(/^([・•]|\d{1,2}[\.．、\)）])\s*/, ""); }

function avatarHtml(size){
  var img = answers.dIcon;
  return '<div class="d-avatar d-avatar-' + size + '"' + (img ? ' style="background-image:url(' + img + ')"' : "") + ">" + (img ? "" : "アイコン") + "</div>";
}

function cycleSvg(center, items){
  var n = items.length;
  if (!n) return "";
  var s = '<svg class="d-cycle" viewBox="0 0 400 300" role="img" aria-label="悪循環の流れ"><circle class="d-cyc-ring" cx="200" cy="150" r="120"/>';
  var step = 360 / n, bw = n > 6 ? 86 : 100;
  for (var k = 0; k < n; k++) {
    var am = (-90 + (k + 0.5) * step) * Math.PI / 180;
    s += '<polygon class="d-cyc-arrow" points="-7,-7 7,0 -7,7" transform="translate(' + (200 + 120 * Math.cos(am)).toFixed(1) + "," + (150 + 120 * Math.sin(am)).toFixed(1) + ") rotate(" + (-90 + (k + 0.5) * step + 90) + ')"/>';
  }
  var cfs = center.length > 5 ? 13 : 18;
  s += '<circle class="d-cyc-center" cx="200" cy="150" r="46"/><text class="d-cyc-center-text" x="200" y="' + (150 + cfs / 3) + '" text-anchor="middle" style="font-size:' + cfs + 'px">' + esc(center) + "</text>";
  items.forEach(function(w, k){
    var a2 = (-90 + k * step) * Math.PI / 180;
    var x = 200 + 120 * Math.cos(a2), y = 150 + 120 * Math.sin(a2);
    var fs = w.length > 8 ? 10 : 12;
    s += '<rect class="d-cyc-box" x="' + (x - bw / 2).toFixed(1) + '" y="' + (y - 22).toFixed(1) + '" width="' + bw + '" height="44" rx="10"/>' +
      '<text class="d-cyc-text" x="' + x.toFixed(1) + '" y="' + (y + fs / 2.5).toFixed(1) + '" text-anchor="middle" style="font-size:' + fs + 'px">' + esc(w) + "</text>" +
      '<circle class="d-cyc-num" cx="' + (x - bw / 2 + 4).toFixed(1) + '" cy="' + (y - 19).toFixed(1) + '" r="9"/>' +
      '<text class="d-cyc-num-text" x="' + (x - bw / 2 + 4).toFixed(1) + '" y="' + (y - 15.5).toFixed(1) + '" text-anchor="middle">' + (k + 1) + "</text>";
  });
  return s + "</svg>";
}

// 部品ごとの見た目（HTML）を作る。返すのは「ページに流しこむ単位」の並び
function blockToUnits(b){
  var t = b.type, body = b.body || [], r, u = [];
  function flow(html, keep){ u.push({ kind: "flow", html: html, keep: !!keep }); }
  switch (t) {
    case "text":
      richChunks(body).forEach(function(h){ flow(h); });
      break;
    case "見出し": if (b.text) flow('<h2 class="d-h2 d-phrase">' + ed(b, inl(b.text), "tag") + "</h2>", true); break;
    case "小見出し": if (b.text) flow('<h3 class="d-h3 d-phrase">' + ed(b, inl(b.text), "tag") + "</h3>", true); break;
    case "章": if (b.text) u.push({ kind: "label", text: b.text }); break;
    case "改ページ": u.push({ kind: "break" }); break;
    // 記号のまちがいの行も、その場で直せる（例：【ポイント】→【強調】）
    case "bad": flow('<p class="d-bad">' + ed(b, esc(b.text), "whole") + "</p>"); break;
    case "表紙":
      u.push({ kind: "cover", f: takeFields(body, ["章", "タイトル", "サブタイトル"]).f });
      break;
    case "強調":
      r = takeFields(body, ["タイトル"]);
      flow('<div class="d-kyocho d-phrase">' + (r.f["タイトル"] ? '<div class="d-kyocho-title">' + ed(r.fl["タイトル"], inl(r.f["タイトル"]), "after") + "</div>" : "") + rich(r.rest) + "</div>");
      break;
    case "悩み":
      flow('<div class="d-nayami">' + nonBlank(body).map(function(x){
        var s = stripBullet(x.s).replace(/^「(.*)」$/, "$1");
        return '<div class="d-nayami-item">「' + ed(x, inl(s), "item") + "」</div>";
      }).join("") + "</div>");
      break;
    case "自己紹介":
      r = takeFields(body, ["名前"]);
      flow('<div class="d-jiko">' + avatarHtml("md") + '<div class="d-jiko-main">' +
        (r.f["名前"] ? '<div class="d-jiko-name">' + ed(r.fl["名前"], inl(r.f["名前"]), "after") + "</div>" : "") + rich(r.rest) + "</div></div>");
      break;
    case "比較":
      var side = null, cards = { A: { head: null, items: [] }, B: { head: null, items: [] } };
      nonBlank(body).forEach(function(x){
        var m = x.s.match(/^【([AB])さん】(.*)$/);
        if (m) { side = m[1]; cards[side].head = { s: trimAll(m[2]), lo: x }; return; }
        if (side) cards[side].items.push(x);
      });
      flow('<div class="d-hikaku">' + ["A", "B"].map(function(k){
        var hd = cards[k].head;
        return '<div class="d-hcard ' + k.toLowerCase() + '"><div class="d-hcard-head">' + k + "さん" +
          (hd && hd.s ? "<small>" + ed(hd.lo, inl(hd.s), "tag") + "</small>" : "") + "</div><ul>" +
          cards[k].items.map(function(x){ return "<li>" + ed(x, inl(stripBullet(x.s)), "item") + "</li>"; }).join("") + "</ul></div>";
      }).join("") + "</div>");
      break;
    case "チェック":
      var items = [], hantei = [];
      nonBlank(body).forEach(function(x){
        var m = x.s.match(/^判定[：:]\s*(.+?)[｜|]\s*(.*)$/);
        if (m) {
          var nums = m[1].match(/(\d+)\s*[〜~～\-－]\s*(\d+)/);
          var one = m[1].match(/(\d+)/);
          hantei.push({ range: m[1], text: m[2], lo: x,
            min: nums ? Number(nums[1]) : one ? Number(one[1]) : 0,
            max: nums ? Number(nums[2]) : one ? Number(one[1]) : 99 });
        } else items.push(x);
      });
      flow('<div class="d-check">' + items.map(function(x){
        return '<div class="d-check-item"><input type="checkbox"><span>' + ed(x, inl(stripBullet(x.s)), "item") + "</span></div>";
      }).join("") + (hantei.length ? '<div class="d-check-count">チェックの数：<span class="js-count">0</span>個</div><div class="d-hantei">' +
        hantei.map(function(h){
          return '<div class="d-hantei-row" data-min="' + h.min + '" data-max="' + h.max + '"><b>' + esc(h.range) + "</b><span>" + ed(h.lo, inl(h.text), "pipe", 1) + "</span></div>";
        }).join("") + "</div>" : "") + "</div>");
      break;
    case "悪循環":
      // 図の中の言葉は、原稿の欄で直す
      r = takeFields(body, ["中心"]);
      flow(cycleSvg(r.f["中心"] || "悪循環", nonBlank(r.rest).map(function(x){ return stripBullet(x.s); }).slice(0, 8)));
      break;
    case "ステップ":
      var steps = [], others = [];
      body.forEach(function(x){
        var m = x.s.match(/^STEP\s*(\d+)\s*[：:]\s*(.*)$/i);
        if (m) {
          var parts = m[2].split(/[｜|]/);
          steps.push({ no: m[1], title: trimAll(parts[0]), desc: trimAll(parts.slice(1).join("｜")), lo: x });
        } else others.push(x);
      });
      flow('<div class="d-steps" style="grid-template-columns:repeat(' + Math.min(Math.max(steps.length, 1), 4) + ',1fr)">' +
        steps.map(function(st){
          return '<div class="d-step"><div class="d-step-num">STEP ' + esc(st.no) + '</div><div class="d-step-title">' + ed(st.lo, inl(st.title), "pipe", 0) + "</div>" +
            (st.desc ? "<p>" + ed(st.lo, inl(st.desc), "pipe", 1) + "</p>" : "") + "</div>";
        }).join("") + "</div>" + rich(others));
      break;
    case "書き込み":
      r = takeFields(body, ["質問", "行数"]);
      var rows = Math.min(Math.max(parseInt(r.f["行数"], 10) || 3, 1), 10);
      var q = r.f["質問"] != null ? ed(r.fl["質問"], inl(r.f["質問"]), "after") : inl(nonBlank(r.rest).map(function(x){ return x.s; }).join(" "));
      flow('<div class="d-kaki"><div class="d-kaki-q">' + q + '</div><div class="d-kaki-lines" style="height:' + (rows * 9) + 'mm"></div></div>');
      break;
    case "チャレンジ表":
      flow('<table class="d-chal"><tr><th>日にち</th><th>やること</th><th>できた？</th><th>ひとこと</th></tr>' +
        nonBlank(body).map(function(x){
          var m = x.s.match(/^(\d+\s*日目)\s*[：:]\s*(.*)$/);
          return '<tr><td class="day">' + (m ? esc(m[1]) : "") + "</td><td>" + (m ? ed(x, inl(m[2]), "after") : ed(x, inl(stripBullet(x.s)), "item")) + '</td><td class="done">○</td><td class="memo"></td></tr>';
        }).join("") + "</table>");
      break;
    case "私自身の場合":
      r = takeFields(body, ["タイトル"]);
      flow('<div class="d-watashi">' + avatarHtml("sm") + '<div class="d-watashi-body">' +
        (r.f["タイトル"] ? '<div class="d-watashi-label">' + ed(r.fl["タイトル"], inl(r.f["タイトル"]), "after") + "</div>" : "") + rich(r.rest) + "</div></div>");
      break;
    case "案内":
      var top = null, ttl = null, dl = [], extra = [], curRow = null;
      body.forEach(function(x){
        var s = x.s;
        if (!s) return;
        // 項目名の行のすぐ下の「1. 〜」「・〜」は、その項目の箇条
        var item = s.match(/^(\d{1,2}[\.．、\)）]|[・•])\s*(.*)$/);
        if (item && curRow) { curRow.items.push({ s: item[2], lo: x, mode: "item" }); return; }
        var m = s.match(/^([^：:]{1,20})[：:]\s*(.*)$/);
        curRow = null;
        if (!m) { extra.push(x); return; }
        var k = trimAll(m[1]);
        if (k === "上の小さい文字") top = { s: m[2], lo: x };
        else if (k === "タイトル") ttl = { s: m[2], lo: x };
        else if (/料金|金額|価格|値段|費用/.test(k)) { hiddenPrice.push(x.n); return; } // 料金はセッションの中で伝えるので、カードには出さない
        else { curRow = { k: k, v: trimAll(m[2]), lo: x, items: [] }; dl.push(curRow); }
      });
      // 案内は無料なので、タイトルに「無料」を入れる
      var ttlHtml = "";
      if (ttl && ttl.s) ttlHtml = (/無料/.test(ttl.s) ? "" : "無料") + ed(ttl.lo, inl(ttl.s), "after");
      flow('<div class="d-annai"><div class="d-annai-head">' + (top && top.s ? "<small>" + ed(top.lo, inl(top.s), "after") + "</small>" : "") + ttlHtml + '</div><div class="d-annai-body"><dl>' +
        dl.map(function(row){
          var items = row.items, val = row.v;
          // 「A／B／C」とつながっていたら、番号つきの箇条に分ける
          var parts = val.split("／");
          if (!items.length && parts.filter(function(p){ return trimAll(p); }).length >= 2 && (parts.length >= 3 || /こと/.test(row.k))) {
            items = parts.map(function(p, pk){ return { s: trimAll(p), lo: row.lo, mode: "slash", k: pk }; }).filter(function(p){ return p.s; });
            val = "";
          }
          var dt = "<dt>" + ed(row.lo, inl(row.k), "key") + "</dt>";
          if (!items.length) return '<div class="d-annai-row">' + dt + "<dd>" + ed(row.lo, inl(val), "after") + "</dd></div>";
          return '<div class="d-annai-row stack">' + dt + "<dd>" + (val ? ed(row.lo, inl(val), "after") : "") +
            '<ol class="d-annai-ol">' + items.map(function(p){ return "<li>" + ed(p.lo, inl(p.s), p.mode, p.k) + "</li>"; }).join("") + "</ol></dd></div>";
        }).join("") + "</dl>" + rich(extra) + "</div></div>");
      break;
    case "受け取り方":
      var us = [], chui = null, ext = [];
      body.forEach(function(x){
        var m = x.s.match(/^STEP\s*\d+\s*[：:]\s*(.*)$/i);
        var c = x.s.match(/^注意[：:]\s*(.*)$/);
        if (m) us.push({ s: m[1], lo: x }); else if (c) chui = { s: c[1], lo: x }; else ext.push(x);
      });
      flow(rich(ext) + '<div class="d-uketori">' + us.map(function(st, k){
        return (k ? '<div class="d-uketori-arrow">▶</div>' : "") + '<div class="d-uketori-step"><div class="d-uketori-num">' + (k + 1) + '</div><div class="d-uketori-text">' + ed(st.lo, inl(st.s), "after") + "</div></div>";
      }).join("") + "</div>" + (chui && chui.s ? '<div class="d-chui"><div class="d-chui-mark">！</div><div>' + ed(chui.lo, inl(chui.s), "after") + "</div></div>" : ""));
      break;
    case "期限":
      r = takeFields(body, ["日数", "ラベル", "案内"]);
      var days = parseInt((r.f["日数"] || "").replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 65248); }), 10) || RECEIVE_DAYS;
      flow('<div class="d-kigen-wrap">' + (r.f["案内"] ? '<p class="d-kigen-lead">' + ed(r.fl["案内"], inl(r.f["案内"]), "after") + "</p>" : "") +
        '<div class="d-kigen"><span class="tag">' + (r.f["ラベル"] ? ed(r.fl["ラベル"], inl(r.f["ラベル"]), "after") : "受け取り期限") + "</span><span>" + days + "日後の23:59まで</span></div></div>");
      break;
    case "締め":
      r = takeFields(body, ["タイトル", "名前"]);
      u.push({ kind: "closing",
        title: r.f["タイトル"] ? ed(r.fl["タイトル"], inl(r.f["タイトル"]), "after") : "",
        name: r.f["名前"] ? ed(r.fl["名前"], inl(r.f["名前"]), "after") : "",
        html: rich(r.rest) });
      break;
  }
  return u;
}

// =====================================================
// ページに流しこむ（入りきらなければ次のページへ）
// =====================================================
function designYago(){
  if (answers.dYago !== undefined) return answers.dYago;
  var y = v("yago"), k = v("katagaki");
  return y && k ? y + "｜" + k : (y || k);
}
function designCatch(){ return answers.dCatch || ""; }
function designColor(){ return answers.dColor || "#2f8f83"; }

function hexToRgb(hex){ hex = hex.replace("#", ""); return [0, 2, 4].map(function(i){ return parseInt(hex.substr(i, 2), 16); }); }
function mixRgb(rgb, to, t){ return rgb.map(function(c, i){ return Math.round(c + (to[i] - c) * t); }); }
function toHex(rgb){ return "#" + rgb.map(function(c){ return ("0" + c.toString(16)).slice(-2); }).join(""); }
function luminance(rgb){
  var c = rgb.map(function(x){ x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function textColorOn(rgb){ var Lm = luminance(rgb); return 1.05 / (Lm + 0.05) >= (Lm + 0.05) / 0.083 ? "#ffffff" : "#333333"; }
// 2つの色の見分けやすさ（1〜21。大きいほど読みやすい）
function contrast(a, b){
  var la = luminance(a), lb = luminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
var WHITE = [255, 255, 255];
// ブランドカラーを、白いカードの上でも読める濃さまで濃くした色
function inkOf(base){
  var c = mixRgb(base, [0, 0, 0], 0.25), t = 0.25;
  while (contrast(c, WHITE) < 4.5 && t < 0.9) { t += 0.05; c = mixRgb(base, [0, 0, 0], t); }
  return c;
}
// 表紙の文字色（自動／白／濃い色）
function coverTextMode(){ return answers.dCoverText || "auto"; }
function coverInk(base){
  var deep = mixRgb(base, [0, 0, 0], 0.72);
  var mode = coverTextMode();
  if (mode === "white") return WHITE;
  if (mode === "dark") return deep;
  // 自動：白で読めるなら白（表紙らしく見える）。白が読みにくい明るい色のときだけ濃い色
  return contrast(WHITE, base) >= 3 ? WHITE : deep;
}
// 白い文字が読みにくい組み合わせか（大きめの文字の目安：3）
function whiteIsHard(hex){ return contrast(WHITE, hexToRgb(hex)) < 3; }

function applyDocColor(hex){
  var base = hexToRgb(hex), dark = mixRgb(base, [0, 0, 0], luminance(base) > 0.5 ? 0.5 : 0.3);
  var st = preview.style;
  st.setProperty("--brand", hex);
  st.setProperty("--brand-dark", toHex(dark));
  st.setProperty("--brand-light", toHex(mixRgb(base, WHITE, 0.55)));
  st.setProperty("--brand-pale", toHex(mixRgb(base, WHITE, 0.9)));
  st.setProperty("--on-brand", textColorOn(base));
  st.setProperty("--on-dark", textColorOn(dark));
  st.setProperty("--brand-ink", toHex(inkOf(base)));
  st.setProperty("--cover-soft", toHex(mixRgb(base, WHITE, 0.62)));
  st.setProperty("--cover-ink", toHex(coverInk(base)));
}

// 全体タイトルの中の「一番強い言葉」を探す（金額 → 数字 → 「」の中の言葉）
// 自動で選ぶ順：数字（金額がいちばん強い）→「」の中の言葉 → タイトルの最後の名詞のまとまり
// ただし、年齢（〜代・〜歳）、範囲（30〜40、3〜5人）、日付（10月8日・2026年・10/8）の数字は選ばない
function strongWord(title){
  title = title || "";
  var re = /(月商|年商|月収|年収|売上|収入|手取り)?\s*\d[\d,，.．]*\s*(億円|万円|円|万|人|名|日|か月|ヶ月|カ月|年|倍|%|％|キロ|kg|分|時間|週間|件|社)?/g;
  var best = null, m;
  while ((m = re.exec(title))) {
    var start = m.index + (m[0].length - m[0].replace(/^\s+/, "").length);
    var end = m.index + m[0].length;
    var before = title.slice(0, start), after = title.slice(end);
    var unit = m[2] || "", digits = (m[0].match(/\d+/) || [""])[0];
    if (/^\s*(代|歳|才)/.test(after)) continue;                               // 年齢
    if (/^\s*[〜~～\-－]\s*\d/.test(after) || /[〜~～\-－]\s*$/.test(before)) continue; // 範囲
    if (/^\s*月(?!商|収)/.test(after) || /^\s*[\/／]\s*\d/.test(after) || /\d\s*[\/／]\s*$/.test(before)) continue; // 日付（10月・10/8）
    if (unit === "日" && /月\s*$/.test(before)) continue;                      // 日付（〇月〇日）
    if (unit === "年" && digits.length === 4) continue;                         // 日付（2026年）
    var score = (m[1] ? 3 : 0) + (/円|万/.test(unit) ? 3 : 0) + (unit ? 1 : 0);
    // 「1日5分」のように、すぐ後ろに数字が続くときは、ひとまとまりにする
    var text = m[0].trim(), more = after.match(/^\d[\d,，.．]*\s*(億円|万円|円|万|人|名|日|か月|ヶ月|カ月|年|倍|%|％|キロ|kg|分|時間|週間|件|社)/);
    if (more) { text += more[0]; re.lastIndex = end + more[0].length; }
    if (!best || score > best.score) best = { text: text, score: score };
  }
  if (best) return best.text;
  var q = title.match(/「([^」]{2,20})」/);
  if (q) return q[1];
  return lastNounPhrase(title);
}
// タイトルの最後の名詞のまとまり（例：「…が増えるおうち整え実践ガイド」→「おうち整え実践ガイド」）
// 「整え」の「え」のような送りがなで止まらないよう、助詞は決まった言葉だけにする
var PARTICLES = ["の", "を", "に", "が", "と", "で", "へ", "は", "も", "や", "から", "まで", "より", "など", "な", "って"];
function lastNounPhrase(title){
  var t = title.replace(/[\s！!？?。．.、，,」』）)]+$/, "");
  if (window.Intl && Intl.Segmenter) {
    var segs = Array.from(new Intl.Segmenter("ja", { granularity: "word" }).segment(t));
    var out = "";
    for (var i = segs.length - 1; i >= 0; i--) {
      var s = segs[i].segment;
      if (!segs[i].isWordLike) break;                                   // 記号で止める
      if (out && PARTICLES.indexOf(s) >= 0) break;                       // 助詞（の・を・に…）で止める
      if (out && /(る|た|だ|い|す|て|く)$/.test(s) && !/[ァ-ヴ一-龠]/.test(s.slice(-1))) break; // 動き・ようすの言葉（増える・速い）で止める
      out = s + out;
      if (out.length >= 14) break;
    }
    if (out.length >= 2) return out;
  }
  var m = t.match(/[ァ-ヴー一-龠々]+$/);
  return m && m[0].length >= 2 ? m[0] : "";
}
// 表紙で目立たせる言葉：欄に入れた言葉があればそれ、なければ自動
function strongTarget(title){
  var manual = v("dStrong");
  if (manual) return title.indexOf(manual) >= 0 ? manual : "";
  return strongWord(title);
}
function titleHtml(title){
  var w = strongTarget(title), i = w ? title.indexOf(w) : -1;
  if (i < 0) return inl(title);
  return inl(title.slice(0, i)) + '<span class="d-cv-strong">' + inl(w) + "</span>" + inl(title.slice(i + w.length));
}

// 「言葉のまとまりで改行」が使えない古いブラウザ向け：言葉の切れ目にだけ改行の場所を入れる
var PHRASE_OK = window.CSS && CSS.supports && CSS.supports("word-break", "auto-phrase");
function phraseFix(root){
  if (PHRASE_OK || !window.Intl || !Intl.Segmenter || !root || !root.querySelectorAll) return;
  var seg = new Intl.Segmenter("ja", { granularity: "word" });
  var targets = root.classList && root.classList.contains("d-phrase") ? [root] : [];
  targets = targets.concat(Array.prototype.slice.call(root.querySelectorAll(".d-phrase")));
  targets.forEach(function(el){
    el.style.wordBreak = "keep-all";
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [], n;
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(function(node){
      var parts = [], cur = "";
      Array.from(seg.segment(node.nodeValue)).forEach(function(s){
        var t = s.segment;
        var glue = cur && (
          (!s.isWordLike && !/^[「『（(【]/.test(t)) ||           // 記号は前にくっつける（開きカッコは後ろへ）
          /^[ぁ-ん]{1,3}$/.test(t) ||                               // 短いひらがな（助詞など）
          /[「『（(【]$/.test(cur) ||                                // 開きカッコのすぐ後
          (/[ァ-ヴー]$/.test(cur) && /^[ァ-ヴー]/.test(t)) ||        // カタカナ同士（ロード＋マップ）
          (/[一-龠々]$/.test(cur) && /^[一-龠々]/.test(t))           // 漢字同士（高＋単価）
        );
        if (glue) cur += t;
        else { if (cur) parts.push(cur); cur = t; }
      });
      if (cur) parts.push(cur);
      if (parts.length < 2) return;
      var frag = document.createDocumentFragment();
      parts.forEach(function(p, k){
        if (k) frag.appendChild(document.createElement("wbr"));
        frag.appendChild(document.createTextNode(p));
      });
      node.parentNode.replaceChild(frag, node);
    });
  });
}

function curChap(){ var c = Number(answers.curChap); return c >= 0 && c <= 3 ? c : 0; }

var layoutInfo = { warns: [], yk: 0, tall: 0 };
var hiddenPrice = [];   // 案内カードに出していない「料金」の行（原稿の行番号）
var lastMainTitle = ""; // 表紙に出している全体タイトル（目立たせる言葉の確認用）
var undoStack = [];     // 「元に戻す」用：{ key, value }

// 原稿の【表紙】に書かれたタイトル2つ（タイトル・サブタイトル）
function coverFieldsOf(idx){
  var text = answers["m" + idx] || "";
  if (!text.trim()) return [];
  var b = parseManuscript(text).blocks.filter(function(x){ return x.type === "表紙"; })[0];
  if (!b) return [];
  var f = takeFields(b.body, ["タイトル", "サブタイトル"]).f;
  return [f["タイトル"], f["サブタイトル"]].filter(Boolean).map(trimAll);
}
// 表紙の「全体タイトル」と「章タイトル」を決める
// 1. 0番の欄に貼ったタイトルを使う
// 2. 欄が空のときだけ原稿の【表紙】から。AIは章によってタイトルとサブタイトルを入れ替えて書くので、
//    ほかの章の【表紙】にも出てくる言葉を「全体タイトル」とみなす
function coverTitles(idx, cf){
  var main = v("tAll"), chap = v("t" + idx);
  if (main && chap) return { main: main, chap: chap };
  var mine = [cf["タイトル"], cf["サブタイトル"]].filter(Boolean).map(trimAll);
  var others = [];
  [0, 1, 2, 3].forEach(function(k){ if (k !== idx) others = others.concat(coverFieldsOf(k)); });
  var shared = mine.filter(function(s){ return others.indexOf(s) >= 0; })[0];
  if (!main) main = shared || (idx === 0 ? cf["タイトル"] : cf["サブタイトル"]) || "";
  if (!chap) {
    var rest = mine.filter(function(s){ return s !== trimAll(main) && s !== shared; });
    chap = rest[0] || (shared ? "" : (idx === 0 ? cf["サブタイトル"] : cf["タイトル"])) || "";
    if (trimAll(chap) === trimAll(main)) chap = "";
  }
  return { main: main || "（要確認）", chap: chap };
}

function layoutChapter(){
  var idx = curChap();
  applyDocColor(designColor());
  preview.innerHTML = "";
  var text = answers["m" + idx] || "";
  if (!text.trim()) {
    preview.innerHTML = '<div class="d-empty">' + CH_NAMES[idx] + "の原稿は、まだ貼られていません。<br>「原稿を貼る」の画面で貼りつけてください。</div>";
    layoutInfo = { warns: [], yk: 0, tall: 0, empty: true };
    updateFinishAlerts();
    return;
  }
  var res = parseManuscript(text);
  var units = [];
  hiddenPrice = [];
  res.blocks.forEach(function(b){ units = units.concat(blockToUnits(b)); });
  // 案内の帯（直し方と「元に戻す」）。印刷には出ない
  preview.innerHTML = '<div class="pv-bar"><span>✎ 文字はクリックして直せます。部品を足したり消したりするときは、原稿の欄で直してください。</span>' +
    '<button class="pv-undo" id="btnUndo"' + (undoStack.length ? "" : " disabled") + ">元に戻す</button></div>";

  var yago = designYago(), cat = designCatch(), label = CH_NAMES[idx], tall = 0;
  var footer = '<div class="d-footer"><span>' + esc(yago) + '</span><span class="d-catch">' + esc(cat) + '</span><span class="d-no"></span></div>';
  var body = null;

  function addSection(html){
    var w = document.createElement("div");
    w.innerHTML = html;
    var sec = w.firstChild;
    preview.appendChild(sec);
    return sec;
  }
  // auto … 入りきらずに自動でできたページ（あふれた分だけが入っている）
  function newPage(auto){
    var sec = addSection('<section class="d-page"><div class="d-label">' + esc(label) + '</div><div class="d-body"></div>' + footer + "</section>");
    body = sec.querySelector(".d-body");
    body.autoPage = !!auto;
  }
  function over(){ return body.scrollHeight > body.clientHeight + 2; }
  function markTall(){ body.parentNode.classList.add("d-tall"); tall++; }

  // 表紙（0番の欄のタイトルから作る。欄が空のときだけ原稿の【表紙】を使う）
  var coverUnit = units.filter(function(x){ return x.kind === "cover"; })[0];
  var cf = coverUnit ? coverUnit.f : {};
  var ct = coverTitles(idx, cf);
  var mainTitle = ct.main, chapTitle = ct.chap;
  lastMainTitle = mainTitle;
  var badge = (cf["章"] || "").split(/[｜|]/)[0] || "LINE登録特典";
  var tfs = mainTitle.length <= 25 ? "24pt" : mainTitle.length <= 45 ? "21pt" : mainTitle.length <= 70 ? "18pt" : "16pt";
  var cover = addSection('<section class="d-page d-cover"><div class="d-cv-card">' +
    '<div class="d-cv-badge">' + inl(badge) + "</div>" +
    '<div class="d-cv-main d-phrase" style="font-size:' + tfs + '">' + edf("tAll", titleHtml(mainTitle)) + "</div>" +
    '<div class="d-cv-line"></div>' +
    '<div class="d-cv-chap">' + esc(CH_NAMES[idx]) + "</div>" +
    (chapTitle ? '<div class="d-cv-sub d-phrase">' + edf("t" + idx, inl(chapTitle)) + "</div>" : "") +
    "</div>" +
    '<div class="d-cv-foot">' + avatarHtml("lg") +
    (cat ? '<div class="d-cv-catch d-phrase">' + edf("dCatch", esc(cat)) + "</div>" : "") +
    (yago ? '<div class="d-cv-yago">' + edf("dYago", esc(yago)) + "</div>" : "") + "</div></section>");
  phraseFix(cover);

  units.forEach(function(un){
    if (un.kind === "cover") return;
    if (un.kind === "label") {
      label = un.text;
      if (body && !body.children.length) body.parentNode.querySelector(".d-label").textContent = label;
      return;
    }
    if (un.kind === "break") {
      if (!body || !body.children.length) return;
      // あふれた文章が少しだけのページなら、改ページせずに続けて使う（ほぼ白いページを作らない）
      var used = body.lastElementChild.getBoundingClientRect().bottom - body.getBoundingClientRect().top;
      if (body.autoPage && used < body.clientHeight / 3) return;
      body = null;
      return;
    }
    if (un.kind === "closing") {
      var sec = addSection('<section class="d-page d-closing"><div class="d-closing-card">' + avatarHtml("lg") +
        (un.title ? '<div class="d-closing-title d-phrase">' + un.title + "</div>" : "") + un.html +
        '<div class="d-closing-sign">' + un.name + "<small>" + edf("dYago", esc(yago)) + "</small></div>" +
        (cat ? '<div class="d-closing-catch">' + edf("dCatch", esc(cat)) + "</div>" : "") + "</div></section>");
      phraseFix(sec);
      if (sec.scrollHeight > sec.clientHeight + 2) { sec.classList.add("d-tall"); tall++; }
      body = null;
      return;
    }
    // ふつうの部品
    if (!body) newPage();
    var w = document.createElement("div");
    w.innerHTML = un.html;
    // 部品の前に文章があるとき（例：受け取り方の前の文）は、まとめて1つにする
    var el = w.children.length === 1 ? w.firstElementChild : w;
    if (!el || !el.childNodes.length) return;
    if (un.keep) el.setAttribute("data-keep", "1");
    phraseFix(el);
    body.appendChild(el);
    if (!over()) return;
    if (body.children.length === 1) { markTall(); return; }
    // 入りきらない → 次のページへ（直前の見出しも一緒に連れていく）
    body.removeChild(el);
    var carry = [];
    var last = body.lastElementChild;
    if (last && last.getAttribute("data-keep") && body.children.length > 1) { body.removeChild(last); carry.push(last); }
    newPage(true);
    carry.forEach(function(c){ body.appendChild(c); });
    body.appendChild(el);
    if (over()) markTall();
  });

  var pages = preview.querySelectorAll(".d-page");
  pages.forEach(function(p, k){ var no = p.querySelector(".d-no"); if (no) no.textContent = (k + 1) + " / " + pages.length; });
  updateCheckLists();

  layoutInfo = { warns: res.warns, yk: preview.querySelectorAll(".d-yk").length, tall: tall };
  updateFinishAlerts();
}

var layoutTimer = null;
function scheduleLayout(){

  layoutTimer = setTimeout(layoutChapter, 250);
}

// 特典の中のチェックリスト：チェックの数で判定の行が光る

    var n = box.querySelectorAll("input:checked").length;
    var c = box.querySelector(".js-count");
    if (c) c.textContent = n;
    box.querySelectorAll(".d-hantei-row").forEach(function(row){
      row.classList.toggle("active", n >= Number(row.getAttribute("data-min")) && n <= Number(row.getAttribute("data-max")));
    });

}

// =====================================================
// 「原稿を貼る」の画面
// =====================================================
function ykListHtml(idx, list){
  return '<ul class="yk-list">' + list.slice(0, 10).map(function(y){
    return '<li><button class="link-btn" data-jump="' + idx + ":" + y.line + '">' + y.line + "行目</button>：" + esc(y.text.length > 60 ? y.text.slice(0, 60) + "…" : y.text) + "</li>";
  }).join("") + (list.length > 10 ? "<li>ほか " + (list.length - 10) + " 行</li>" : "") + "</ul>";
}
function pasteStatusHtml(idx){
  var c = checkChapter(idx), h = "";
  if (c.empty) return '<span style="color:#888">まだ貼られていません</span>';
  if (c.warns.length) h += '<span class="ng">⚠ ' + c.warns.length + "か所、記号を確認してください</span>" + warnListHtml(idx, c.warns);
  else h += '<span class="ok">✓ 記号はOKです</span>';
  if (c.ykCount) h += '<div class="yk">（要確認）が ' + c.ykCount + " か所あります（行番号を押すと、その場所に移動します）</div>" + ykListHtml(idx, c.yk);
  return h;
}
// 全体のまとめ（4章の状態）。貼ったり書きかえたりするたびに作り直す
function pasteSummaryHtml(){
  return '<div class="summary-head"><b>全体のまとめ</b><button class="small-btn" data-recheck="1">もう一度チェックする</button></div><ul class="summary-list">' +
    CH_NAMES.map(function(nm, i){
      var c = checkChapter(i), s;
      if (c.empty) s = '<span style="color:#888">まだ貼られていません</span>';

}
function updatePasteSummary(){

function recheckAll(){

      var el = document.getElementById("st" + i);
